# Template for Nginx >= 1.25.1 with HTTP/2 and gzip_static modules.
# Replace the domain, certificate paths and /srv/game-arcade/current for your host.
# Ensure the parent http configuration includes mime.types.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name game.yituohub.com _;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://game.yituohub.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name game.yituohub.com;
    ssl_certificate /etc/letsencrypt/live/game.yituohub.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/game.yituohub.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:NeonArcadeSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /srv/game-arcade/current;
    index index.html;
    charset utf-8;
    server_tokens off;
    autoindex off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30s;
    keepalive_requests 1000;
    gzip on;
    gzip_static on;
    # Uncomment after installing and loading ngx_brotli_static.
    # brotli_static on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Current assets keep mutable paths, including /game-arcade/vendor/three/.
    # Revalidate all files so later updates at the same URL remain visible.
    add_header Cache-Control "no-cache" always;
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ =404; }
}
