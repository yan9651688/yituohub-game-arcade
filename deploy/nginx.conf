# Nginx >= 1.25.1. Install ngx_brotli_static for brotli_static support.
# Replace the domain, certificate paths and /srv/neon-arcade/current for your host.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name game.yituohub.com _;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://game.yituohub.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name game.yituohub.com;
    ssl_certificate /etc/letsencrypt/live/game.yituohub.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/game.yituohub.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:NeonArcadeSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /srv/neon-arcade/current;
    index index.html;
    charset utf-8;
    server_tokens off;
    autoindex off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30s;
    keepalive_requests 1000;
    gzip on;
    gzip_static on;
    brotli_static on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Public media filenames are their original-byte SHA-256 digest.
    location ^~ /assets/media/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    # Fingerprinted UI files and previews change URL when their contents change.
    location ~ "^/assets/.+\.[0-9a-f]{12}\.(?:css|js|png|jpg|jpeg|webp|svg|ico)$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    # Preserve requests from already-open pages of the previous deployment.
    location ^~ /vendor/three/ {
        alias /srv/neon-arcade/current/vendor/three-0.160.0/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    location ^~ /vendor/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    location ~ \.(?:html|json)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ =404; }
}
