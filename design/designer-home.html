<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NEON ARCADE · AI 小游戏站</title>
<meta name="description" content="由 AI 创造的小游戏宇宙。" />
<style>
  :root {
    --bg: #03040a;
    --cyan: #00f0ff;
    --magenta: #ff2bd6;
    --violet: #8a5cff;
    --lime: #b6ff3b;
    --accent: #00f0ff;
    --text: #e8f1ff;
    --muted: #7d8aa8;
    --line: rgba(0, 240, 255, 0.18);
    --mono: "JetBrains Mono", "Cascadia Code", Consolas, "SFMono-Regular", monospace;
    --sans: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); -webkit-font-smoothing: antialiased; user-select: none; }
  a { color: inherit; text-decoration: none; }

  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  #stage.dragging { cursor: grabbing; }
  .fx { position: fixed; inset: 0; pointer-events: none; }
  .scanlines { background: repeating-linear-gradient(0deg, rgba(255,255,255,.028) 0 1px, transparent 1px 3px); mix-blend-mode: overlay; }
  .vignette { background: radial-gradient(ellipse at 56% 47%, transparent 40%, rgba(0,0,0,.8) 100%); }
  .ui { position: fixed; z-index: 5; }

  /* 四角框 */
  .corner { position: fixed; width: 22px; height: 22px; border: 0 solid rgba(0,240,255,.5); z-index: 5; pointer-events: none; }
  .corner.tl { top: 16px; left: 16px; border-width: 1px 0 0 1px; }
  .corner.tr { top: 16px; right: 16px; border-width: 1px 1px 0 0; }
  .corner.bl { bottom: 16px; left: 16px; border-width: 0 0 1px 1px; }
  .corner.br { bottom: 16px; right: 16px; border-width: 0 1px 1px 0; }

  /* 顶栏 */
  header { top: 0; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between; padding: 30px 48px; pointer-events: none; }
  header > * { pointer-events: auto; }
  .logo { display: flex; align-items: center; gap: 12px; font-family: var(--mono); font-weight: 700; letter-spacing: .2em; font-size: 15px; }
  .logo-mark { width: 24px; height: 24px; border: 1.5px solid var(--cyan); transform: rotate(45deg); position: relative;
    box-shadow: 0 0 12px var(--cyan), inset 0 0 8px rgba(0,240,255,.5); animation: spin 8s linear infinite; }
  .logo-mark::after { content: ""; position: absolute; inset: 5px; border: 1.5px solid var(--magenta); box-shadow: 0 0 10px var(--magenta); }
  @keyframes spin { to { transform: rotate(405deg); } }
  nav { display: flex; gap: 36px; font-family: var(--mono); font-size: 13px; letter-spacing: .14em; }
  nav a { color: var(--muted); transition: color .2s, text-shadow .2s; }
  nav a:hover { color: var(--cyan); text-shadow: 0 0 10px var(--cyan); }
  nav a::before { content: "/"; color: var(--magenta); margin-right: 6px; opacity: .7; }

  /* 主文案 */
  .copy { left: 48px; bottom: 64px; max-width: 560px; }
  .tag { font-family: var(--mono); font-size: 12px; letter-spacing: .32em; color: var(--cyan); display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
  .tag .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 10px var(--lime); animation: blink 1.6s infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  h1 { font-size: clamp(44px, 6.6vw, 104px); line-height: .98; font-weight: 900; letter-spacing: -.02em; }
  h1 .l1 { display: block; color: transparent; -webkit-text-stroke: 1.4px var(--cyan); filter: drop-shadow(0 0 14px rgba(0,240,255,.55)); position: relative; }
  h1 .l2 { display: block; background: linear-gradient(90deg, var(--magenta), var(--violet) 50%, var(--cyan));
    -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 22px rgba(255,43,214,.4)); }
  .l1::before, .l1::after { content: attr(data-text); position: absolute; left: 0; top: 0; -webkit-text-stroke: 0; pointer-events: none; }
  .l1::before { color: var(--magenta); animation: g1 3.4s infinite steps(1); }
  .l1::after  { color: var(--cyan);    animation: g2 3.4s infinite steps(1); }
  @keyframes g1 { 0%,92%,100% { clip-path: inset(100% 0 0 0); } 93% { clip-path: inset(10% 0 60% 0); transform: translateX(-6px); } 95% { clip-path: inset(55% 0 20% 0); transform: translateX(5px); } 97% { clip-path: inset(30% 0 45% 0); transform: translateX(-3px); } }
  @keyframes g2 { 0%,92%,100% { clip-path: inset(100% 0 0 0); } 93% { clip-path: inset(70% 0 5% 0); transform: translateX(6px); } 95% { clip-path: inset(5% 0 75% 0); transform: translateX(-5px); } 97% { clip-path: inset(40% 0 35% 0); transform: translateX(3px); } }
  .sub { margin-top: 24px; font-size: 16px; line-height: 1.85; color: #a9b6d3; }
  .sub b { color: var(--text); font-weight: 600; }
  .actions { margin-top: 34px; display: flex; gap: 16px; flex-wrap: wrap; }
  .btn { font-family: var(--mono); font-size: 14px; letter-spacing: .18em; padding: 17px 32px; display: inline-flex; align-items: center; gap: 12px; cursor: pointer; border: none;
    clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px); transition: transform .2s, box-shadow .2s, background .2s; }
  .btn-primary { background: linear-gradient(90deg, var(--cyan), #52a8ff); color: #00111a; font-weight: 700; box-shadow: 0 0 30px rgba(0,240,255,.45); }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 0 50px rgba(0,240,255,.8); }
  .btn-ghost { background: rgba(255,43,214,.06); color: var(--magenta); outline: 1px solid var(--magenta); outline-offset: -1px; }
  .btn-ghost:hover { background: rgba(255,43,214,.16); }
  .btn .arrow { transition: transform .2s; }
  .btn:hover .arrow { transform: translateX(4px); }

  /* 形态面板 */
  .forms { right: 48px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 6px; }
  .form-item { display: grid; grid-template-columns: 34px 1fr; gap: 2px 12px; padding: 12px 18px 12px 14px; cursor: pointer; text-align: right;
    border-right: 1px solid rgba(125,138,168,.25); transition: border-color .3s, background .3s; }
  .form-item .idx { grid-row: span 2; font-family: var(--mono); font-size: 12px; color: var(--muted); align-self: center; text-align: left; }
  .form-item .cn { font-size: 15px; color: var(--muted); transition: color .3s; }
  .form-item .en { font-family: var(--mono); font-size: 10px; letter-spacing: .2em; color: rgba(125,138,168,.6); }
  .form-item .bar { grid-column: 1 / -1; height: 1px; background: rgba(125,138,168,.15); margin-top: 8px; overflow: hidden; }
  .form-item .bar i { display: block; height: 100%; width: 0; background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .form-item:hover .cn { color: var(--text); }
  .form-item.on { border-right: 2px solid var(--accent); background: linear-gradient(270deg, rgba(255,255,255,.05), transparent); }
  .form-item.on .cn { color: var(--text); text-shadow: 0 0 12px var(--accent); }
  .form-item.on .idx, .form-item.on .en { color: var(--accent); }

  /* 形态标题 */
  .caption { left: 56%; top: 9%; transform: translateX(-50%); text-align: center; pointer-events: none; }
  .caption .no { font-family: var(--mono); font-size: 11px; letter-spacing: .4em; color: var(--muted); }
  .caption .name { margin-top: 8px; font-family: var(--mono); font-size: 20px; letter-spacing: .35em; color: var(--accent); text-shadow: 0 0 16px var(--accent); white-space: nowrap; }

  /* 数据读数 */
  .readout { right: 48px; bottom: 44px; font-family: var(--mono); font-size: 11px; letter-spacing: .15em; color: var(--muted); text-align: right; line-height: 2; }
  .readout b { color: var(--accent); font-weight: 400; }
  .hint { left: 56%; bottom: 36px; transform: translateX(-50%); font-family: var(--mono); font-size: 11px; letter-spacing: .25em; color: rgba(125,138,168,.7); white-space: nowrap; }
  .hint kbd { font-family: inherit; border: 1px solid rgba(125,138,168,.4); padding: 1px 6px; margin: 0 2px; }

  @media (max-width: 900px) {
    header { padding: 22px 24px; }
    nav { display: none; }
    .copy { left: 24px; right: 24px; bottom: 40px; }
    .sub { font-size: 14px; }
    .forms { right: auto; left: 50%; top: auto; bottom: auto; top: 58%; transform: translateX(-50%); flex-direction: row; gap: 10px; }
    .form-item { display: block; width: 36px; padding: 0; border: none; }
    .form-item .cn, .form-item .en, .form-item .idx { display: none; }
    .form-item .bar { height: 3px; margin: 0; background: rgba(125,138,168,.3); }
    .form-item.on { border: none; background: none; }
    .caption { left: 50%; top: 10%; }
    .caption .name { font-size: 15px; }
    .readout, .hint { display: none; }
  }
</style>
</head>
<body>

<canvas id="stage"></canvas>
<div class="fx scanlines"></div>
<div class="fx vignette"></div>
<span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>

<header class="ui">
  <a href="./" class="logo"><span class="logo-mark"></span>NEON ARCADE</a>
  <nav>
    <a href="games.html">游戏库</a>
    <a href="#">更新日志</a>
    <a href="#">关于</a>
  </nav>
</header>

<div class="ui caption">
  <div class="no" id="capNo">FORM 01 / 06</div>
  <div class="name" id="capName">TRINITY KNOT</div>
</div>

<section class="ui copy">
  <div class="tag"><span class="dot"></span>AI-GENERATED GAME UNIVERSE</div>
  <h1><span class="l1" data-text="AI 造梦">AI 造梦</span><span class="l2">游戏宇宙</span></h1>
  <p class="sub">每一款游戏都由 <b>AI 参与创造</b>。<br />不用下载，点开就玩。</p>
  <div class="actions">
    <a href="games.html" class="btn btn-primary">进入游戏库 <span class="arrow">→</span></a>
    <button class="btn btn-ghost" id="nextBtn">切换形态 ⟳</button>
  </div>
</section>

<aside class="ui forms" id="forms"></aside>

<div class="ui readout">
  <div>VOXELS <b id="rTris">0</b></div>
  <div>POINTS <b id="rPts">0</b></div>
  <div>FPS <b id="rFps">60</b></div>
</div>
<div class="ui hint">拖拽旋转 · 点击变形 · <kbd>←</kbd><kbd>→</kbd> / <kbd>1</kbd>–<kbd>6</kbd> 切换</div>

<script>
/* ================================================================
 *  工具
 * ================================================================ */
const TAU = Math.PI * 2;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const mix = (a, b, k) => [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k];
const ease = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rY = (p, a) => { const c = Math.cos(a), s = Math.sin(a); return [p[0] * c + p[2] * s, p[1], -p[0] * s + p[2] * c]; };
const rX = (p, a) => { const c = Math.cos(a), s = Math.sin(a); return [p[0], p[1] * c - p[2] * s, p[1] * s + p[2] * c]; };
const rZ = (p, a) => { const c = Math.cos(a), s = Math.sin(a); return [p[0] * c - p[1] * s, p[0] * s + p[1] * c, p[2]]; };
const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const scl = (a, k) => [a[0] * k, a[1] * k, a[2] * k];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const nrm = a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
// 由“主轴 + 参考上方向”构造正交基 [x, y, z]
function basis(x, up = [0, 1, 0]) {
  x = nrm(x);
  let y = sub(up, scl(x, dot(up, x)));
  if (Math.hypot(...y) < 1e-4) y = sub([0, 0, 1], scl(x, x[2]));
  y = nrm(y);
  return [x, y, cross(x, y)];
}
const I3 = [[1, 0, 0], [0, 1, 0], [0, 0, 1]];
const rotB = (B, f) => B.map(f);

const C = {
  cyan: [20, 230, 255], teal: [0, 255, 200], blue: [50, 120, 255], deep: [70, 80, 255], violet: [150, 70, 255],
  magenta: [240, 60, 255], pink: [255, 60, 200], orange: [255, 120, 40], amber: [255, 170, 70], gold: [255, 210, 120], ember: [255, 90, 30], white: [230, 240, 255],
};

/* ================================================================
 *  方块写入器：每个形态每帧写入一批“发光玻璃方块”
 *  box(中心, 半尺寸[sx,sy,sz], 基[x,y,z], 颜色, 透明度, 自发光 0~1)
 * ================================================================ */
const MAXB = 900;
const BC = new Float32Array(MAXB * 3), BS = new Float32Array(MAXB * 3), BR = new Float32Array(MAXB * 9);
const BCOL = new Float32Array(MAXB * 3), BA = new Float32Array(MAXB), BG = new Float32Array(MAXB), BE = new Float32Array(MAXB), BK = new Float32Array(MAXB), BQ = new Float32Array(MAXB * 12);
let bn = 0;
function box(c, s, B, col, a = 1, g = 0, e = 1) {
  BC.set(c, bn * 3); BS.set(s, bn * 3);
  BR.set(B[0], bn * 9); BR.set(B[1], bn * 9 + 3); BR.set(B[2], bn * 9 + 6);
  BCOL.set(col, bn * 3); BA[bn] = a; BG[bn] = g; BE[bn] = e; BK[bn] = 0; BQ.set([-s[0], -s[1], 0, s[0], -s[1], 0, s[0], s[1], 0, -s[0], s[1], 0], bn * 12); bn++;
}
// 多边形面（三角 / 四边形）：存中心 + 基 + 各顶点局部坐标；法线朝外（背离 o）
function poly(V, col, a = 1, g = 0, e = 1, o = null) {
  let n = V.length === 4 ? cross(sub(V[2], V[0]), sub(V[3], V[1])) : cross(sub(V[1], V[0]), sub(V[2], V[0]));
  const c = scl(V.reduce(add), 1 / V.length);
  if (o ? dot(n, sub(c, o)) < 0 : n[2] > 0) n = scl(n, -1);
  n = nrm(n);
  const d = sub(V[1], V[0]), x = nrm(sub(d, scl(n, dot(d, n)))), y = cross(n, x);
  const L = V.map(p => { const q = sub(p, c); return [dot(q, x), dot(q, y), dot(q, n)]; });
  if (L.length === 3) L.push(L[2]);
  const s = [Math.max(...L.map(l => Math.abs(l[0]))), Math.max(...L.map(l => Math.abs(l[1]))), 0.004];
  box(c, s, [x, y, n], col, a, g, e);
  BK[bn - 1] = 1; BQ.set(L.flat(), (bn - 1) * 12);
}

/* ================================================================
 *  形态 1：三结环 —— 一根方截面管子打成的三叶结，截面沿管缓慢扭转，
 *  一段光脉冲沿管流动
 * ================================================================ */
const KNOT = (() => {
  const s = 0.29, N = 48, F = 2000;
  const P = u => [s * (Math.sin(u) + 2 * Math.sin(2 * u)), s * (Math.cos(u) - 2 * Math.cos(2 * u)), s * -Math.sin(3 * u) * 1.1];
  // 按弧长等距取样
  const us = [0], L = [0];
  for (let i = 1; i <= F; i++) { const u = i / F * TAU; us.push(u); L.push(L[i - 1] + Math.hypot(...sub(P(u), P(us[i - 1])))); }
  const total = L[F], seg = total / N, pts = [];
  for (let k = 0, j = 0; k < N; k++) {
    const target = k * seg; while (L[j + 1] < target) j++;
    pts.push(P(us[j] + (target - L[j]) / (L[j + 1] - L[j]) * (us[j + 1] - us[j])));
  }
  // 平行移动标架，避免截面乱翻
  const T = pts.map((p, i) => nrm(sub(pts[(i + 1) % N], pts[(i + N - 1) % N])));
  const Nm = [nrm(cross(T[0], [0, 0, 1]))];
  for (let i = 1; i < N; i++) Nm.push(nrm(sub(Nm[i - 1], scl(T[i], dot(Nm[i - 1], T[i])))));
  const end = nrm(sub(Nm[N - 1], scl(T[0], dot(Nm[N - 1], T[0]))));
  const hol = Math.atan2(dot(cross(end, Nm[0]), T[0]), dot(end, Nm[0]));
  for (let i = 0; i < N; i++) { const a = hol * i / N, b = cross(T[i], Nm[i]); Nm[i] = nrm(add(scl(Nm[i], Math.cos(a)), scl(b, Math.sin(a)))); }
  return { pts, T, Nm, N, half: seg / 2 };
})();
function buildRings(t) {
  const { pts, T, Nm, N, half } = KNOT;
  const view = v => rX(rY(rZ(v, t * 0.25), Math.sin(t * 0.4) * 0.4), 0.2 + Math.sin(t * 0.3) * 0.12);
  const pulse = (t * 0.12) % 1;
  for (let i = 0; i < N; i++) {
    const tw = i / N * Math.PI + t * 0.6;                      // 截面扭转
    const b = cross(T[i], Nm[i]);
    const side = add(scl(Nm[i], Math.cos(tw)), scl(b, Math.sin(tw)));
    const Bv = basis(T[i], side).map(view);
    const d = Math.abs(i / N - pulse), glow = Math.max(0, 1 - Math.min(d, 1 - d) * 14);
    const col = mix(mix(C.teal, C.blue, 0.5 + 0.5 * Math.sin(i / N * TAU * 3)), C.magenta, glow);
    // 单列立方体（同双螺旋的方块风格），块与块之间留缝
    const cs = half * 0.8;
    box(view(pts[i]), [cs, cs, cs], Bv, col, 1, glow * 0.6);
  }
}
function ringLines(t) {
  const circle = (r, y) => Array.from({ length: 97 }, (_, i) => [Math.cos(i / 96 * TAU) * r, y, Math.sin(i / 96 * TAU) * r]);
  return [{ pts: circle(1.25, -1.1), col: C.teal, dash: true }];
}

/* ================================================================
 *  形态 2：双螺旋 —— 分段方块横条层层扭转（时而笔直时而螺旋）
 * ================================================================ */
function buildHelix(t) {
  const L = 16, cs = 0.058, gap = 0.128, dy = 0.148;
  const twist = 0.42 * (0.5 + 0.5 * Math.sin(t * 0.55 - 1));
  for (let l = 0; l < L; l++) {
    const n = Math.max(1, Math.round(8 - Math.abs(l - 8) * 0.95));
    const ang = l * twist + t * 0.35 + l * 0.12;
    const y = (l - L / 2) * dy + 0.05;
    const B = basis([Math.cos(ang), 0, -Math.sin(ang)]);
    const col = l % 2 ? C.violet : C.blue;
    for (let i = 0; i < n; i++) {
      const x = (i - (n - 1) / 2) * gap;
      const end = n > 2 && (i === 0 || i === n - 1);
      const c = add([0, y, 0], scl(B[0], x));
      // 两端的方块构成“两条链”
      box(c, [cs * 0.88, cs * 0.72, cs], B, end ? (i === 0 ? C.cyan : C.magenta) : col, 1, end ? 0.25 : 0);
    }
  }
}

/* ================================================================
 *  形态 3：空构面具 —— 136 个四边形格子沿眼眶 / 鼻 / 唇 / 颏布线，
 *  每格沿法线挤出成“前壳 + 内壳 + 连杆”的空心线框（不填面）；

  sk.addColorStop(0, "rgba(2,3,10,0)"); sk.addColorStop(1, rgba(mix([10, 8, 40], accent, 0.18), 0.9));
  ctx.fillStyle = sk; ctx.fillRect(0, 0, W, HZ);
  // 星空（随视角轻微视差）
  for (const s of STARS) {
    const x = ((s[0] * W * 1.3 - ay * W * 0.05) % (W * 1.3) + W * 1.3) % (W * 1.3) - W * 0.15, y = s[1] * (HZ - 20);
    const a = (0.15 + 0.55 * s[2]) * (0.55 + 0.45 * Math.sin(t * (0.6 + s[3] * 2) + s[3] * 40)) * (1 - s[1] * 0.6);
    ctx.fillStyle = rgba(s[3] > 0.85 ? C.cyan : C.white, a);
    const z = s[2] > 0.93 ? 1.8 : 1; ctx.fillRect(x, y, z, z);
  }
  // 远处漂浮的巨型线框方块
  ctx.globalCompositeOperation = "lighter"; ctx.lineWidth = 1;
  for (const m of MONO) {
    const c = add(m.p, [0, Math.sin(t * 0.3 + m.ph) * 0.25, 0]), a = m.ph + t * m.sp;
    const V = [];
    for (let k = 0; k < 8; k++) {
      const v = rX(rY([(k & 1 ? 1 : -1) * m.s, (k & 2 ? 1 : -1) * m.s, (k & 4 ? 1 : -1) * m.s], a), a * 0.6);
      V.push(fp(c[0] + v[0], c[1] + v[1], c[2] + v[2]));
    }
    if (V.some(v => !v)) continue;
    const mx0 = V.reduce((s, v) => s + v[0], 0) / 8, fa = mobile ? 1 : clamp((W * 0.84 - mx0) / (W * 0.1)) * clamp((mx0 - W * 0.3) / (W * 0.1));
    if (fa < 0.02) continue;
    ctx.beginPath();
    for (const [p, q] of [[0,1],[2,3],[4,5],[6,7],[0,2],[1,3],[4,6],[5,7],[0,4],[1,5],[2,6],[3,7]]) { ctx.moveTo(V[p][0], V[p][1]); ctx.lineTo(V[q][0], V[q][1]); }
    ctx.strokeStyle = rgba(mix(accent, C.violet, 0.5), 0.16 * fa); ctx.stroke();
  }
  // 两层天际线（远层慢、近层快）
  ctx.globalCompositeOperation = "source-over";
  const { PW, hh } = SKY;
  SKY.L.forEach((cv, L) => {
    const ox = ((-ay * W * (L ? 0.26 : 0.13) + (L ? 0 : PW * 0.37)) % PW + PW) % PW;
    ctx.globalAlpha = L ? 0.9 : 0.55;
    ctx.drawImage(cv, -ox, HZ - hh, PW, hh); ctx.drawImage(cv, PW - ox, HZ - hh, PW, hh);
  });
  ctx.globalAlpha = 1;
  // 地面底色
  const gb = ctx.createLinearGradient(0, HZ, 0, H);
  gb.addColorStop(0, "#050716"); gb.addColorStop(1, "#02030a");
  ctx.fillStyle = gb; ctx.fillRect(0, HZ, W, H - HZ);
  // 透视网格（世界坐标，跟随拖拽旋转）
  ctx.globalCompositeOperation = "lighter";
  const cell = 0.6, NL = 26, RR = NL * cell;
  const line = (a, b) => {
    let A = [a[0] * cy + a[1] * sy, -a[0] * sy + a[1] * cy + DIST], Bq = [b[0] * cy + b[1] * sy, -b[0] * sy + b[1] * cy + DIST];
    if (A[1] < 0.35 && Bq[1] < 0.35) return;
    if (A[1] < 0.35 || Bq[1] < 0.35) { const k = (0.35 - A[1]) / (Bq[1] - A[1]), P = [A[0] + (Bq[0] - A[0]) * k, 0.35]; if (A[1] < 0.35) A = P; else Bq = P; }
    ctx.moveTo(CX + A[0] * FOC / A[1], HZ + camH * FOC / A[1]); ctx.lineTo(CX + Bq[0] * FOC / Bq[1], HZ + camH * FOC / Bq[1]);
  };
  ctx.beginPath();
  for (let i = -NL; i <= NL; i++) { line([i * cell, -RR], [i * cell, RR]); line([-RR, i * cell], [RR, i * cell]); }
  const gg = ctx.createLinearGradient(0, HZ, 0, H);
  gg.addColorStop(0, rgba(accent, 0)); gg.addColorStop(0.3, rgba(accent, 0.12)); gg.addColorStop(1, rgba(accent, 0.3));
  ctx.strokeStyle = gg; ctx.lineWidth = 1; ctx.stroke();
  // 地砖：从脚下扩散的涟漪 + 零星闪烁
  const r0 = (t * 0.9) % 8, wA = 1 - r0 / 8;
  for (let i = -12; i < 12; i++) for (let j = -12; j < 12; j++) {
    const cx0 = (i + 0.5) * cell, cz0 = (j + 0.5) * cell, d = Math.hypot(cx0, cz0);
    const h = Math.abs(Math.sin(i * 127.1 + j * 311.7) * 43758.5) % 1;
    let b = Math.exp(-(((d - r0) / 0.45) ** 2)) * wA * 0.8;
    if (h > 0.94) b += Math.max(0, Math.sin(t * (0.8 + h) + h * 60)) ** 6 * 0.9;
    if (b < 0.04) continue;
    const q = [[0, 0], [1, 0], [1, 1], [0, 1]].map(([u, v]) => fp(i * cell + u * cell, -1.25, j * cell + v * cell));
    if (q.some(v => !v)) continue;
    ctx.beginPath(); ctx.moveTo(q[0][0], q[0][1]); for (let k = 1; k < 4; k++) ctx.lineTo(q[k][0], q[k][1]); ctx.closePath();
    ctx.fillStyle = rgba(h > 0.97 ? C.magenta : accent, 0.13 * b); ctx.fill();
    ctx.strokeStyle = rgba(mix(accent, C.white, 0.4), 0.4 * b); ctx.stroke();
  }
  // 脚下的接地光斑
  ctx.save(); ctx.translate(CX, floorY); ctx.scale(1, 0.22);
  const cg = ctx.createRadialGradient(0, 0, 0, 0, 0, FOC * 0.42);
  cg.addColorStop(0, rgba(accent, 0.16)); cg.addColorStop(1, rgba(accent, 0));
  ctx.fillStyle = cg; ctx.fillRect(-FOC * 0.42, -FOC * 0.42, FOC * 0.84, FOC * 0.84); ctx.restore();
  // 地平线雾 + 光线
  ctx.globalCompositeOperation = "source-over";
  const fog = ctx.createLinearGradient(0, HZ - 30, 0, HZ + (floorY - HZ) * 0.45);
  fog.addColorStop(0, "rgba(5,7,22,0)"); fog.addColorStop(0.35, "rgba(5,7,22,0.85)"); fog.addColorStop(1, "rgba(5,7,22,0)");
  ctx.fillStyle = fog; ctx.fillRect(0, HZ - 30, W, (floorY - HZ) * 0.45 + 30);
  ctx.globalCompositeOperation = "lighter";
  const hg = ctx.createLinearGradient(0, HZ - 50, 0, HZ + 24);
  hg.addColorStop(0, rgba(accent, 0)); hg.addColorStop(0.68, rgba(accent, 0.13)); hg.addColorStop(1, rgba(accent, 0));
  ctx.fillStyle = hg; ctx.fillRect(0, HZ - 50, W, 74);
  const hl = ctx.createLinearGradient(0, 0, W, 0);
  hl.addColorStop(0, rgba(accent, 0)); hl.addColorStop(CX / W, rgba(mix(accent, C.white, 0.3), 0.5)); hl.addColorStop(1, rgba(accent, 0));
  ctx.fillStyle = hl; ctx.fillRect(0, HZ, W, 1);
  // 左侧文案区压暗，保证可读性
  ctx.globalCompositeOperation = "source-over";
  if (!mobile) {
    const lv = ctx.createLinearGradient(0, 0, W * 0.48, 0);
    lv.addColorStop(0, "rgba(2,3,10,0.78)"); lv.addColorStop(1, "rgba(2,3,10,0)");
    ctx.fillStyle = lv; ctx.fillRect(0, 0, W * 0.48, H);
    const rv = ctx.createLinearGradient(W * 0.78, 0, W, 0);
    rv.addColorStop(0, "rgba(2,3,10,0)"); rv.addColorStop(1, "rgba(2,3,10,0.6)");
    ctx.fillStyle = rv; ctx.fillRect(W * 0.78, 0, W * 0.22, H);
  }
}

let fpsAcc = 0, fpsN = 0, lastFrame = performance.now();
function frame() {
  const nowMs = performance.now(), dt = Math.min(50, nowMs - lastFrame); lastFrame = nowMs;
  fpsAcc += dt; fpsN++;
  if (fpsAcc > 500) { document.getElementById("rFps").textContent = Math.round(1000 / (fpsAcc / fpsN)); fpsAcc = fpsN = 0; }

  const t = now(), f = FORMS[cur];
  if (t - holdStart > HOLD) goTo(cur + 1);
  const P = (t - tStart) / DUR;
  bars[cur].style.width = clamp((t - holdStart) / HOLD) * 100 + "%";

  smx += (mx - smx) * 0.05; smy += (my - smy) * 0.05;
  if (!drag) { vyaw *= 0.94; vpitch *= 0.94; pitch *= 0.985; }
  yaw += vyaw; pitch = clamp(pitch + vpitch, -1.2, 1.2);
  const ay = yaw + smx * 0.6, axp = pitch + smy * 0.3 - 0.08;
  cyw = Math.cos(ay); syw = Math.sin(ay); cp = Math.cos(axp); sp = Math.sin(axp);

  // 目标几何
  bn = 0; f.build(t);
  const map = f.map, ghost = f.ghost;
  if (needDelays) {
    needDelays = false;
    const mode = Math.floor(Math.random() * 3); let lo = 1e9, hi = -1e9; const val = new Float32Array(B);
    for (let i = 0; i < B; i++) { const o = map[i] * 3, x = BC[o], y = BC[o + 1], z = BC[o + 2]; val[i] = mode === 0 ? -y : mode === 1 ? x : Math.hypot(x, y, z); lo = Math.min(lo, val[i]); hi = Math.max(hi, val[i]); }
    for (let i = 0; i < B; i++) delay[i] = (val[i] - lo) / (hi - lo || 1) * 0.42 + Math.random() * 0.08;
  }
  for (let i = 0; i < B; i++) {
    const j = map[i], gh = ghost[i];
    const ta = gh ? 0 : BA[j], tg = BG[j];
    if (P < 1) {
      const k = clamp((P - delay[i]) / 0.5), e = ease(k), b = Math.sin(Math.PI * k);
      for (let q = 0; q < 3; q++) {
        pc[i * 3 + q] = fc[i * 3 + q] + (BC[j * 3 + q] - fc[i * 3 + q]) * e + burst[i * 3 + q] * b;
        ps[i * 3 + q] = fs[i * 3 + q] + ((gh ? 0 : BS[j * 3 + q]) - fs[i * 3 + q]) * e;
        pcol[i * 3 + q] = fcol[i * 3 + q] + (BCOL[j * 3 + q] - fcol[i * 3 + q]) * e;
      }
      // 姿态插值 + 飞行中的翻滚，再正交化
      let X = [0, 1, 2].map(q => fR[i * 9 + q] + (BR[j * 9 + q] - fR[i * 9 + q]) * e);
      let Y = [0, 1, 2].map(q => fR[i * 9 + 3 + q] + (BR[j * 9 + 3 + q] - fR[i * 9 + 3 + q]) * e);
      const roll = bspin[i] * b;
      X = rZ(rX(X, roll), roll * .7); Y = rZ(rX(Y, roll), roll * .7);
      const Bn = basis(Math.hypot(...X) < 1e-3 ? [1, 0, 0] : X, Y);
      pR.set(Bn[0], i * 9); pR.set(Bn[1], i * 9 + 3); pR.set(Bn[2], i * 9 + 6);
      pa[i] = fa[i] + (ta - fa[i]) * e; pg[i] = fg[i] + (tg - fg[i]) * e; pe[i] = fe[i] + (BE[j] - fe[i]) * e;
      for (let q = i * 12, r = j * 12, m = q + 12; q < m; q++, r++) pq[q] = fq[q] + (BQ[r] - fq[q]) * e;
      pkind[i] = e > 0.5 ? BK[j] : fkind[i];
    } else {
      pc.set(BC.subarray(j * 3, j * 3 + 3), i * 3);
      if (gh) ps.fill(0, i * 3, i * 3 + 3); else ps.set(BS.subarray(j * 3, j * 3 + 3), i * 3);
      pR.set(BR.subarray(j * 9, j * 9 + 9), i * 9);
      pcol.set(BCOL.subarray(j * 3, j * 3 + 3), i * 3);
      pa[i] = ta; pg[i] = tg; pe[i] = BE[j]; pkind[i] = BK[j]; pq.set(BQ.subarray(j * 12, j * 12 + 12), i * 12);
    }
  }

  accent = mix(accent, f.accent, 0.04);
  spread += (f.spread(t) - spread) * 0.05;
  document.documentElement.style.setProperty("--accent", rgba(accent, 1));

  /* ---------- 背景 ---------- */
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1;
  ctx.fillStyle = "#02030a"; ctx.fillRect(0, 0, W, H);
  drawWorld(t, ay);
  const Rr = Math.min(W, H) * (mobile ? 0.36 : 0.4);
  const bgG = ctx.createRadialGradient(CX, CY, 0, CX, CY, Rr * 2.2);
  bgG.addColorStop(0, rgba(accent, 0.1)); bgG.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = bgG; ctx.fillRect(0, 0, W, H);
  drawHUD(t, Rr);

  /* ---------- 场景 ---------- */
  sx.setTransform(DPR, 0, 0, DPR, 0, 0);
  sx.clearRect(0, 0, W, H);
  sx.lineJoin = "round";

  // 环境尘埃
  sx.globalCompositeOperation = "lighter";
  for (const d of dust) {
    const v = view(d[0] + Math.sin(t * 0.1 + d[3] * 9) * 0.1, d[1] + Math.sin(t * 0.13 + d[3] * 7) * 0.1, d[2]);
    if (v[2] + DIST < 0.5) continue;
    const s = proj(v);
    sx.fillStyle = rgba(mix(accent, C.white, 0.5), (0.2 + 0.5 * Math.sin(t * 1.5 + d[3] * 20) ** 2) * clamp(s[2] / 300));
    sx.fillRect(s[0], s[1], 1.3, 1.3);
  }

  // 轨道线（按形态淡入淡出）
  FORMS.forEach((F, fi) => {
    F.fade += ((fi === cur && P > 0.5 ? 1 : 0) - F.fade) * 0.04;
    if (F.lines && F.fade > 0.01) drawLines(F.lines(t), F.fade, t);
  });

  // 方块：由远及近
  let cnt = 0;
  for (let i = 0; i < B; i++) {
    if (pa[i] < 0.01 || ps[i * 3] + ps[i * 3 + 1] + ps[i * 3 + 2] < 0.004) continue;
    depthArr[i] = view(pc[i * 3], pc[i * 3 + 1], pc[i * 3 + 2])[2];
    order[cnt++] = i;
  }
  const ord = Array.from(order.subarray(0, cnt)).sort((a, b) => depthArr[b] - depthArr[a]);
  for (const i of ord) drawBox(i);
  flushPolyEdges();
  document.getElementById("rTris").textContent = cnt;

  // 点云粒子
  sx.globalCompositeOperation = "lighter";
  for (let p = 0; p < NP; p++) {
    const i = pbox[p], u = pu[p * 3], v = pu[p * 3 + 1], w = pu[p * 3 + 2];
    const s0 = ps[i * 3], s1 = ps[i * 3 + 1], s2 = ps[i * 3 + 2], r = i * 9;
    let x = pc[i * 3] + pR[r] * s0 * u + pR[r + 3] * s1 * v + pR[r + 6] * s2 * w;
    let y = pc[i * 3 + 1] + pR[r + 1] * s0 * u + pR[r + 4] * s1 * v + pR[r + 7] * s2 * w;
    let z = pc[i * 3 + 2] + pR[r + 2] * s0 * u + pR[r + 5] * s1 * v + pR[r + 8] * s2 * w;
    const k = 1 + po[p] * spread; x *= k; y *= k; z *= k;
    const lr = 0.05 + pk[p] * 0.08;
    px[p] += (x - px[p]) * lr; py[p] += (y - py[p]) * lr; pz[p] += (z - pz[p]) * lr;
    const V = view(px[p], py[p], pz[p]); if (V[2] + DIST < 0.5) continue;
    const S = proj(V);
    let X = S[0], Y = S[1];
    const dx = X - pointer.x, dy = Y - pointer.y, d2 = dx * dx + dy * dy;
    if (d2 < 10000) { const d = Math.sqrt(d2) || 1, m = (1 - d2 / 10000) * 24; X += dx / d * m; Y += dy / d * m; }
    const al = Math.max(pa[i], 0.12) * clamp((1.8 - V[2]) / 3, 0.1, 1) * (0.35 + po[p] * 0.5);
    const col = pk[p] > 0.75 ? C.white : mix([pcol[i * 3], pcol[i * 3 + 1], pcol[i * 3 + 2]], C.white, 0.35);
    sx.fillStyle = rgba(col, al);
    const sz = Math.max(0.8, S[2] * 0.0028) * (pk[p] > 0.95 ? 1.8 : 1);
    sx.fillRect(X - sz / 2, Y - sz / 2, sz, sz);
  }

  /* ---------- 泛光 + 地面倒影 ---------- */
  ba.clearRect(0, 0, bloomA.width, bloomA.height); ba.drawImage(scene, 0, 0, bloomA.width, bloomA.height);
  bb.clearRect(0, 0, bloomB.width, bloomB.height); bb.drawImage(bloomA, 0, 0, bloomB.width, bloomB.height);

  const floorY = CY + 1.25 * FOC / DIST;
  const fy = floorY / 4, rw = refl.width, rh = refl.height;
  rc.globalCompositeOperation = "source-over";
  rc.clearRect(0, 0, rw, rh);
  rc.save(); rc.translate(0, fy * 2); rc.scale(1, -1.15);  // 镜像并略微拉长，模拟湿地面
  rc.globalAlpha = 0.55; rc.drawImage(bloomA, 0, 0, rw, rh);
  rc.globalAlpha = 0.5; rc.drawImage(bloomB, 0, 0, rw, rh);
  rc.restore();
  rc.globalAlpha = 1;
  rc.globalCompositeOperation = "destination-in";
  const rg = rc.createLinearGradient(0, fy, 0, rh);
  rg.addColorStop(0, "rgba(0,0,0,1)"); rg.addColorStop(0.5, "rgba(0,0,0,0.3)"); rg.addColorStop(1, "rgba(0,0,0,0)");
  rc.fillStyle = rg; rc.fillRect(0, 0, rw, rh);
  rc.globalCompositeOperation = "destination-out"; rc.fillStyle = "#000"; rc.fillRect(0, 0, rw, fy);

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
  // 地面光带
  const fl = ctx.createLinearGradient(0, floorY * DPR, 0, H * DPR);
  fl.addColorStop(0, rgba(accent, 0.07)); fl.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = fl; ctx.fillRect(0, floorY * DPR, W * DPR, (H - floorY) * DPR);
  ctx.globalCompositeOperation = "lighter";
  ctx.drawImage(refl, 0, 0, stage.width, stage.height);
  ctx.globalAlpha = 0.9; ctx.drawImage(bloomB, 0, 0, stage.width, stage.height);
  ctx.globalAlpha = 0.65; ctx.drawImage(bloomA, 0, 0, stage.width, stage.height);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
  ctx.drawImage(scene, 0, 0);

  requestAnimationFrame(frame);
}

// 环绕的 HUD 圆环（淡）
function drawHUD(t, R) {
  ctx.save();
  ctx.translate(CX, CY);
  ctx.strokeStyle = rgba(accent, 0.1); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(0, 0, R * 1.22, 0, TAU); ctx.stroke();
  ctx.rotate(t * 0.04);
  for (let i = 0; i < 120; i++) {
    const a = i / 120 * TAU, long = i % 10 === 0, r1 = R * 1.26, r2 = r1 + (long ? 10 : 4);
    ctx.strokeStyle = rgba(accent, long ? 0.3 : 0.1);
    ctx.beginPath(); ctx.moveTo(Math.cos(a) * r1, Math.sin(a) * r1); ctx.lineTo(Math.cos(a) * r2, Math.sin(a) * r2); ctx.stroke();
  }
  ctx.rotate(-t * 0.04);
  ctx.lineWidth = 1.5;
  for (let k = 0; k < 2; k++) {
    const s = t * (0.25 + k * 0.15) * (k ? -1 : 1) + k * 2;
    ctx.strokeStyle = rgba(k ? C.magenta : accent, 0.3);
    ctx.beginPath(); ctx.arc(0, 0, R * (1.14 + k * 0.03), s, s + 0.6 + k * 0.3); ctx.stroke();
  }
  ctx.restore();
}

// 支持 ?form=1~5 直接定位到某个形态
goTo(clamp((+new URLSearchParams(location.search).get("form") || 1) - 1, 0, FORMS.length - 1));
requestAnimationFrame(frame);

</script>
