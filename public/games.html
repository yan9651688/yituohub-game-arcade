  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

<body>
  <a class="skip-link" href="#catalogue">跳到游戏列表</a>
  <header class="site-header page-width">
    <a class="brand" href="index.html" aria-label="NEON ARCADE 首页"><span class="brand-mark" aria-hidden="true"></span><span>NEON ARCADE<small>AI 造梦 · 游戏宇宙</small></span></a>
    <nav aria-label="主导航"><a href="index.html">首页</a><a href="games.html" aria-current="page">游戏库</a><a href="mv.html">AI放映厅 <span aria-hidden="true">↗</span></a></nav>
  </header>
  <main class="page-width">
    <section class="library-intro" aria-labelledby="library-title">
      <div class="intro-copy"><p class="eyebrow"><span aria-hidden="true"></span>THE GAME LIBRARY</p><h1 id="library-title">下一场，<em>玩什么。</em></h1><p class="intro-description">从一场战斗，到另一个世界。选你喜欢的，点开就玩。</p></div>
      <div class="library-count" aria-label="游戏总数"><strong id="total-games">05</strong><span>款游戏<br><b>等你入场</b></span></div>
    </section>
    <section class="catalogue" id="catalogue" aria-label="浏览小游戏">
      <div class="browse-bar">
        <div id="category-filters" class="category-filters" role="group" aria-label="按游戏类型筛选"></div>
        <form class="search" role="search" id="search-form"><label class="visually-hidden" for="game-search">搜索游戏名称、玩法或操作</label><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m16 16 5 5"></path></svg><input id="game-search" type="search" placeholder="搜索游戏或玩法" autocomplete="off" maxlength="100"><button id="clear-search" type="button" aria-label="清除搜索" hidden>×</button><span class="search-shortcut" aria-hidden="true">/</span></form>
      </div>
      <div class="results-bar"><h2 id="results-heading">全部游戏</h2><p id="result-count" role="status" aria-live="polite" aria-atomic="true"></p></div>
      <div id="game-grid" class="game-grid" aria-labelledby="results-heading"></div>
      <div id="empty-state" class="empty-state" hidden><span class="empty-symbol" aria-hidden="true">⌕</span><h3>暂时没找到这款游戏</h3><p>试试游戏名称，或「射击」「竞速」这样的玩法。</p><button id="reset-filters" type="button">查看全部游戏 <span aria-hidden="true">↗</span></button></div>

    </section>
  </main>
  <footer class="site-footer page-width"><a href="index.html">NEON ARCADE</a><p>玩心不设限。</p><a href="#library-title">回到顶部 <span aria-hidden="true">↑</span></a></footer>
