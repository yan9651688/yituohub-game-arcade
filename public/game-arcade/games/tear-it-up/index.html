<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f2efe8"><title>撕个痛快 · 只管撕</title><link rel="stylesheet" href="style.css?v=23"><link rel="stylesheet" href="site-mobile.css?v=20261022"></head>
<body><main><header><div class="brand"><span class="mark" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h6l-2 7 4 3-3 8H5V3M16 3h3v18h-4M9 4v3M8 16v3"/></svg></span><div><h1>撕个痛快</h1><p>不必收拾，也不必解释。</p></div></div><div class="header-actions"><button id="sound" class="sound" aria-label="关闭声音" aria-pressed="true"><span id="soundIcon" aria-hidden="true">◖</span><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 5 5 9H2v6h3l5 4z"/><path class="sound-waves" d="M14 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/><path class="sound-off" d="m15 9 6 6m0-6-6 6"/></svg><span id="soundText">声音开</span></button><label class="tear-language" data-no-game-i18n><span lang="en">LANGUAGE</span><select id="tear-language" aria-label="LANGUAGE — 游戏语言"><option value="zh-Hans" lang="zh-Hans">简体中文</option><option value="zh-Hant" lang="zh-Hant">繁體中文</option><option value="en" lang="en">English</option></select></label></div></header>
<nav class="scenes" aria-labelledby="sceneHeading"><h2 id="sceneHeading" class="section-label">场景</h2><button class="scene selected" data-scene="clips" aria-pressed="true">双夹布</button><button class="scene" data-scene="line" aria-pressed="false">晾衣绳</button><button class="scene" data-scene="curtain" aria-pressed="false">门帘</button><button class="scene" data-scene="frame" aria-pressed="false">绷布框</button><button class="scene" data-scene="flat" aria-pressed="false">平铺桌面</button><button class="scene" data-scene="sphere" aria-pressed="false">圆球覆布</button><button class="scene" data-scene="slope" aria-pressed="false">斜面垂落</button><button class="scene" data-scene="flag" aria-pressed="false">迎风小旗</button></nav>
<section class="studio" aria-label="撕布区域"><canvas id="cloth" aria-label="拖住棉布，向任意方向拉扯。也可以按住空格并使用方向键拉扯。" tabindex="0" aria-describedby="toolNote"></canvas><div id="performanceMeter" class="performance-meter" hidden aria-live="off">正在采样帧率…</div><div class="hint" id="hint" aria-hidden="true"><span>捏住一角，慢慢拉开</span><small>或用力一扯。</small></div></section>
<section class="workbench" aria-label="工具台"><div class="tools" role="group" aria-labelledby="toolHeading"><h2 id="toolHeading" class="section-label">工具</h2><button class="tool selected" data-tool="hand" aria-pressed="true"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 12V5a1.5 1.5 0 0 1 3 0v6-7a1.5 1.5 0 0 1 3 0v7-5a1.5 1.5 0 0 1 3 0v6-3a1.5 1.5 0 0 1 3 0v6c0 4-2.5 6-6 6h-1c-2 0-3.5-1-4.5-2.5L4 13a1.5 1.5 0 0 1 2-2z"/></svg>手撕</button><button class="tool" data-tool="clip" aria-pressed="false"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 9 1-5h6l1 5 3 9H5zM9 4V2m6 2V2M5 18v3h14v-3M8 14h8"/></svg>夹子</button><button class="tool" data-tool="scissors" aria-pressed="false"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="17" r="3"/><circle cx="18" cy="17" r="3"/><path d="m8 15 11-12M16 15 5 3"/></svg>剪刀</button><button class="tool" data-tool="knife" aria-pressed="false"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14 4 6 6-9 9-7 1 1-7zM12 6l6 6M5 13l6 6M16 2l6 6"/></svg>刀</button><button class="tool" data-tool="fire" aria-pressed="false"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2c1 5-5 6-4 10-2-1-2-3-2-3-5 7 0 13 6 13s10-6 6-12c0 3-2 4-2 4 1-5-1-9-4-12Z"/><path d="M12 14c-3 3-3 6 0 7 4-1 3-4 0-7Z"/></svg>火焰</button><button class="tool" data-tool="paint" aria-pressed="false"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 9h8v12H7zM9 9V5h4v4M9 5V3h5M15 13h2v5h-2"/><path d="M17 3h.01M20 2h.01M20 5h.01M23 3h.01" stroke-width="2"/></svg>喷枪</button><button class="tool" data-tool="hook" aria-pressed="false"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3v12a5 5 0 0 1-10 0v-3l3 3M11 3h6M17 3v5"/></svg>小钩子</button></div><div class="tool-options"><span id="toolNote">捏住一角，慢慢拉开</span><div id="paintControls" hidden><label>颜料 <input id="paintColor" type="color" value="#be4e55" aria-label="喷涂颜色"></label><label>范围 <input id="brushSize" type="range" min="12" max="65" value="30" aria-label="喷涂范围"></label><button id="clearPaint">清除颜料</button></div><div id="fireControls" hidden><label>火焰画质 <select id="fireQuality" aria-label="火焰画质"><option value="auto">原貌</option><option value="clear">清晰</option><option value="smooth">精简粒子</option></select></label><button id="performanceToggle" aria-pressed="false">帧率</button><button id="extinguish">扑灭全部火焰</button></div></div></section>
<div class="materials"><div class="material-switch" role="group" aria-labelledby="materialHeading"><h2 id="materialHeading" class="section-label">材质</h2><button class="material selected" data-material="cotton" aria-pressed="true"><span class="material-preview" aria-hidden="true"></span><span>薄棉布</span></button><button class="material" data-material="denim" aria-pressed="false"><span class="material-preview" aria-hidden="true"></span><span>牛仔布</span></button><button class="material" data-material="gauze" aria-pressed="false"><span class="material-preview" aria-hidden="true"></span><span>纱布</span></button><button class="material" data-material="stocking" aria-pressed="false"><span class="material-preview" aria-hidden="true"></span><span>薄丝袜</span></button><button class="material" data-material="silk" aria-pressed="false"><span class="material-preview" aria-hidden="true"></span><span>丝绸</span></button><button class="material" data-material="linen" aria-pressed="false"><span class="material-preview" aria-hidden="true"></span><span>亚麻</span></button><button class="material" data-material="felt" aria-pressed="false"><span class="material-preview" aria-hidden="true"></span><span>毛毡</span></button><button class="material" data-material="fishing_net" aria-pressed="false"><span class="material-preview" aria-hidden="true"></span><span>渔网</span></button><button class="material" data-material="chain_mail" aria-pressed="false"><span class="material-preview" aria-hidden="true"></span><span>铁环网</span></button><button class="material" data-material="jelly" aria-pressed="false"><span class="material-preview" aria-hidden="true"></span><span>果冻</span></button><button class="material" data-material="slime" aria-pressed="false"><span class="material-preview" aria-hidden="true"></span><span>史莱姆</span></button></div><span id="materialNote" aria-live="polite">轻软好撕 · 慢慢拉出裂口</span></div><footer><div class="palette" role="group" aria-label="布料配色"><button class="swatch selected" style="--swatch:#e5c9ae" data-color="0" aria-label="原棉色" aria-pressed="true"></button><button class="swatch" style="--swatch:#a8b9b6" data-color="1" aria-label="雾青色" aria-pressed="false"></button><button class="swatch" style="--swatch:#c6a9a3" data-color="2" aria-label="陶粉色" aria-pressed="false"></button><span>配色</span></div><button id="reset" class="reset"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7v5h-5M19 12a7 7 0 1 0-2 5M20 12l-3-5"/></svg><span>换一块</span></button><span class="quiet">只管撕，别的先放下。</span></footer></main><script src="site-locale.js?v=20261022"></script><script src="physics.js?v=23"></script><script src="burn-audio.js?v=23"></script><script src="gel-audio.js?v=23"></script><script src="stocking-render.js?v=23"></script><script src="surface-contour.js?v=23"></script><script src="app.js?v=23"></script></body></html>
