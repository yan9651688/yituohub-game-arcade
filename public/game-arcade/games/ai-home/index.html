<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI之家 · 星灯里</title><link rel="stylesheet" href="style.css?v=d031ac9d7bcd"></head><body>
<canvas id="game" aria-label="游戏画面"></canvas>
<div id="vignette"></div><header><button id="brand">✦ AI之家 <small>星灯里</small></button><div class="top-actions"><span id="coin">鲸圆券 0</span><button id="characters">伙伴</button><button id="wardrobe-button" aria-label="大肥鱼的衣橱">衣橱</button><button id="journal">手记</button><button id="growth" aria-label="共享属性成长">成长</button><label class="language-control" title="语言 / Language"><span aria-hidden="true">🌐</span><select id="language-select" data-locale-control aria-label="选择语言"><option value="zh-CN">简</option><option value="zh-TW">繁</option><option value="en">EN</option></select></label><button id="menu" aria-label="游戏菜单">☰</button></div></header>
<section id="quest"><span class="eyebrow" id="mode-label">HOME / 星灯里</span><h2 id="objective">欢迎回家</h2><p id="objective-detail">门廊的灯亮着。</p></section>
<aside id="home-life-panel"><div class="life-panel-title"><strong>星灯里</strong><span id="life-phase">午后</span></div><canvas id="home-map" width="192" height="154" aria-label="住户位置示意图"></canvas><p id="life-summary"></p><button id="go-residents">大家在哪</button><button id="chat-activity" hidden>聊两句</button><button id="leave-activity" hidden>起身，随处走走</button></aside>
<section id="battle-shell" hidden aria-label="战斗指挥界面">
 <div class="battle-mission"><span id="battle-kicker"></span><h1 id="battle-title"></h1><div class="battle-situation"><span id="battle-phase"></span><span>剩余 <b id="battle-enemies">0</b></span><span>连击 <b id="battle-combo">0</b></span></div></div>
 <div class="battle-wave-block"><div><span class="battle-wave-caption">WAVE</span><strong id="battle-wave">01</strong><span id="battle-wave-total"></span></div><div class="battle-wave-track"><i id="battle-wave-progress"></i></div><small id="battle-milestone"></small></div>
 <nav class="battle-actions" aria-label="战斗菜单"><span id="battle-time">00:00</span><button id="battle-pause" aria-label="暂停战斗"><span class="battle-pause-icon" aria-hidden="true"></span><span>暂停</span></button><button id="battle-return">撤回小屋</button></nav>
 <p id="battle-hint"></p>
</section>
<section id="combat-hud" hidden aria-label="主战状态"><div class="battle-portrait"><img id="battle-portrait" alt=""><i aria-hidden="true">✦</i></div><div class="battle-vitals"><div class="battle-vitals-caption"><span>ACTIVE / 主战</span><span id="battle-shield" hidden></span></div><div class="health-line"><strong id="hero-name"></strong><span id="hp-text"></span></div><div class="bar" id="battle-health-meter" role="meter" aria-label="生命" aria-valuemin="0" aria-valuenow="0" aria-valuemax="100"><i id="hp-fill"></i></div><div class="battle-energy-caption" id="battle-energy-label"></div><div class="energy" id="battle-energy-meter" role="meter" aria-label="终极能量" aria-valuemin="0" aria-valuenow="0" aria-valuemax="100"><i id="energy-fill"></i></div><div id="wave-line"></div></div></section>
<aside id="endless-hud" hidden data-i18n-dynamic aria-label="守夜援护与战术"></aside>
<section id="race-hud" hidden aria-label="算力追猎仪表">
 <div class="chase-pilot-block"><div class="chase-pilot-medallion"><img id="race-pilot" alt="DeepSeek" hidden><span aria-hidden="true">✦</span></div><div class="chase-pilot-copy"><strong>DeepSeek</strong><span id="race-stability" aria-label="稳定度 4 / 4">◆◆◆◆</span></div><div class="chase-speed"><span id="race-speed">0</span><small>km/h</small></div></div>
 <div class="chase-course-progress"><div><span id="race-course"></span><span id="race-distance"></span></div><div id="race-progress-meter" class="race-progress-track" role="meter" aria-label="赛程进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="race-progress"></i></div><span class="chase-progress-end" aria-hidden="true">◆</span></div>
 <div class="chase-top-right"><div class="chase-resource"><span class="chase-chip-icon" aria-hidden="true">▧</span><span>算力 <strong id="race-compute">0</strong></span><span class="chase-gpu">显卡 <b id="race-gpus">0</b></span></div><button id="race-pause" aria-label="暂停追猎"><span class="chase-pause-bars" aria-hidden="true"></span></button><button id="race-return" aria-label="返回小屋">⌂</button></div>
 <div class="chase-status-line"><span id="race-boost">自动奔跑</span><span id="race-combo">沿路吃算力</span><span id="race-clock">00:00</span></div>
 <div class="chase-targets"><span class="chase-target-caption">已吸收 <b id="race-caught">0</b><small id="race-caught-total"> / 7</small></span><ol><li id="race-rival-claude" data-caught="false"><span class="chase-rival-frame"><img alt="Claude" hidden><i aria-hidden="true">✓</i></span><small>Claude</small></li><li id="race-rival-kimi" data-caught="false"><span class="chase-rival-frame"><img alt="Kimi" hidden><i aria-hidden="true">✓</i></span><small>Kimi</small></li><li id="race-rival-gpt" data-caught="false"><span class="chase-rival-frame"><img alt="GPT" hidden><i aria-hidden="true">✓</i></span><small>GPT</small></li><li id="race-rival-gemini" data-caught="false"><span class="chase-rival-frame"><img alt="Gemini" hidden><i aria-hidden="true">✓</i></span><small>Gemini</small></li><li id="race-rival-grok" data-caught="false"><span class="chase-rival-frame"><img alt="Grok" hidden><i aria-hidden="true">✓</i></span><small>Grok</small></li><li id="race-rival-qwen" data-caught="false"><span class="chase-rival-frame"><img alt="千问" hidden><i aria-hidden="true">✓</i></span><small>千问</small></li><li id="race-rival-glm" data-caught="false"><span class="chase-rival-frame"><img alt="智谱" hidden><i aria-hidden="true">✓</i></span><small>智谱</small></li></ol></div>
 <span id="race-notice" role="status"></span>
</section>
<aside id="race-depth-hud" hidden aria-label="技巧链与临时特质">
  <span class="chase-depth-label">TECHNIQUE / 技巧接续</span><div class="race-depth-chain-line"><strong id="race-depth-chain">技巧链 · 待接</strong><span id="race-depth-bonus"></span></div>
  <div id="race-depth-meter" role="meter" aria-label="技巧链接续时间" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="race-depth-fill"></i></div>
  <span id="race-depth-grace">漂亮动作可接续</span>
  <div id="race-depth-trait" data-state="empty"><span class="race-depth-avatar" aria-hidden="true"><img id="race-depth-portrait" alt="" hidden><span id="race-depth-icon">✦</span></span><div class="race-depth-trait-copy"><div><strong id="race-depth-name">暂无特质</strong><span id="race-depth-time"></span></div><span id="race-depth-use">吸收 AI 自动获得</span></div></div>
  <span id="race-depth-toast" hidden role="status" aria-live="polite" aria-atomic="true"></span>
</aside>
<section id="turn-hud" hidden role="status" aria-live="polite" aria-atomic="true">
  <span class="turn-arrow" aria-hidden="true"><svg viewBox="0 0 80 80" focusable="false"><path d="M 18 64 V 36 Q 18 20 34 20 H 64 M 48 4 L 64 20 L 48 36"/></svg></span>
  <div class="turn-copy" aria-hidden="true"><strong id="turn-direction"></strong><span id="turn-status"></span></div>
  <span id="turn-announcement" class="sr-only"></span>
</section>
<div id="center-banner" hidden></div><div id="interact" hidden></div><div id="toast" role="status" hidden></div>
<footer><div id="help"></div><div id="skills" hidden><button id="attack-button"><svg class="ability-icon" viewBox="0 0 40 40" aria-hidden="true"><path d="M9 30 28 11 M20 10h10v10 M8 16l16 16 M6 26l8 8"/></svg><b>J / 左键</b><span>攻击</span></button><button id="dodge-button"><svg class="ability-icon" viewBox="0 0 40 40" aria-hidden="true"><path d="m8 12 12 8-12 8m12-16 12 8-12 8"/></svg><b>空格</b><span>闪避</span></button><button id="skill-button"><svg class="ability-icon" viewBox="0 0 40 40" aria-hidden="true"><path d="m20 4 5 11 11 5-11 5-5 11-5-11L4 20l11-5Z M20 12v16 M12 20h16"/></svg><b>E</b><span>剑招</span></button><button id="ult-button"><svg class="ability-icon" viewBox="0 0 40 40" aria-hidden="true"><path d="m20 4 4 8 9 1-5 8 3 10-11-4-11 4 3-10-5-8 9-1Z"/></svg><b>Q</b><span>终极技能</span></button><button id="meal-button"><svg class="ability-icon" viewBox="0 0 40 40" aria-hidden="true"><path d="M8 23h24c-1 9-6 11-12 11S9 32 8 23Z M13 17c-6-6 6-6 0-12 M21 17c-6-6 6-6 0-12 M29 17c-6-6 6-6 0-12"/></svg><b>R</b><span>热饭 × 0</span></button></div><div id="home-shortcuts"><button id="go-activities">☕ 一起做点什么</button><button id="go-kitchen">♨ 厨房</button><button id="go-combat">⚔ 防卫战</button><button id="go-race">➜ 算力追猎</button></div></footer>
<div id="loading-status"></div><div id="modal-backdrop" hidden><section id="modal" data-i18n-dynamic role="dialog" aria-modal="true" aria-labelledby="modal-title"></section></div>
<script src="assets/portraits.js"></script><script src="assets/wardrobe-portraits.js"></script><script src="assets/dialogue-portraits.js"></script><script src="game.js?v=09e0837e72b6"></script></body></html>
