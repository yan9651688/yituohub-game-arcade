nfunction settle(){let cols=[];for(let x=0;x<10;x++){let c=[];for(let y=0;y<10;y++)if(b[y*10+x]>=0)c.push(b[y*10+x]);if(c.length)cols.push(Array(10-c.length).fill(-1).concat(c))}b=Array(100).fill(-1);cols.forEach((c,x)=>c.forEach((v,y)=>b[y*10+x]=v))}\nfunction finish(){if(groups().length)return;active=false;let left=b.filter(v=>v>=0).length,bonus=left<10?Math.max(0,2000-left*left*20):0;score+=bonus;stageScore+=bonus;saveBest(score);update();if(stageScore>=target){if(level<5)end('这一口，很甜！','剩余 '+left+' 颗 · 盘底奖励 '+bonus+' 分',()=>{level++;start(false)},'下一种口味');else end('果冻收藏完成','五关全通 · 总分 '+score,()=>start())}else end('还差一点甜度','本关 '+stageScore+' / '+target+' 分 · 试着攒更大的一片',()=>start())}\n$('#board').onclick=e=>{let el=e.target.closest('[data-i]');if(!el||!active)return;let i=+el.dataset.i;if(b[i]<0)return;const match=group(i);picked=[];if(match.length<2){say('这一颗有点孤单，找找相邻的同色伙伴');render();return}let n=match.length,add=n*n*5;TileFX.burst(match.map(i=>$('#board').children[i]));match.forEach(i=>b[i]=-1);score+=add;stageScore+=add;saveBest(score);settle();render();say('啵！'+n+' 连消 · +'+add+' 分');finish()};$('#hint').onclick=()=>{if(!active)return;let gs=groups().sort((a,b)=>b.length-a.length);if(gs.length){picked=gs[0];render();say('这一大片有 '+picked.length+' 颗，点击其中任意一颗即可消除')}};function start(reset=true){TileFX.clear();if(reset){runStartBest=best;runMilestone=0;}if(reset){level=1;score=0}target=1200+level*200;stageScore=0;picked=[];b=Array.from({length:100},()=>Math.floor(Math.random()*5));active=true;hideEnd();render();say('先找一大片，再享受一声清脆的啵！');if(!groups().length)start(reset)}$('#restart').onclick=()=>start();start();\n<\/script></body></html>";</script><script>const $=q=>document.querySelector(q),isTea=KIND==='tea',E=isTea?TeaEngine:PopEngine,L=LEVELS,icons=isTea?['🍵','🍡','🍊','🥮','🌿','🍙','🌸','🍑','🥨']:['爱心','花朵','方糖','星星','圆糖'],colors=['#f07b8f','#a897d3','#79bcb0','#eda948','#7cb8de'],chapters=['01 · 初见与入门','02 · 单项技巧','03 · 组合练习','04 · 综合挑战'],SAVE='arcade-v03-'+KIND+'-campaig function finish(){if(E.won(s,L[level])){done=true;let p=progress[key(L[level])]||{};p.clear=true;p.best=Math.min(p.best??999,s.turns);if(!assisted)p.independent=true;else p.assisted=true;progress[key(L[level])]=p;save();$('#resultTitle').textContent=isTea?'茶山清空，茶香还在':'整盘果冻，收入瓶中';$('#resultText').textContent=L[level].title+' · '+(assisted?'辅助完成':'独立完成')+'。'+(level===23?'24 关随时可自由复玩。':'下一关，换一种观察方法。');$('#continueBtn').textContent=level===23?'回看棋盘':'下一关';$('#continueBtn').onclick=()=>level===23?($('#overlay').hidden=true):start(level+1);$('#overlay').hidden=false;render()}else if(failed()){$('#resultTitle').textContent=isTea?'茶盘满了，再想一步':'再安排一次合流';$('#resultText').textContent=isTea?'凑第三张之前，先为揭盖留位置。可无限撤销，也可原样重试。':'还没满足清空与连消目标。可无限撤销，比较不同顺序。';$('#continueBtn').textContent='撤销上一步';$('#continueBtn').onclick=undo;$('#overlay').hidden=false;render()}}
function play(i){if(done||failed())return;let t=E.step(s,i);highlight=[];if(!t){render();say(isTea?'先收上面挡住它的茶点；明牌清单可查看全部图案。':'这一颗暂时落单；点击至少两颗相邻同色中的任意一颗。');return}if(isTea){if(t.last){const value=s.tiles.find(x=>x.id===i).v;TileFX.burst([$('#board').querySelector('[data-i="'+i+'"]'),...s.tray.map((x,k)=>x.v===value?$('#tray').children[k]:null)])}}else{const group=E.groups(s).find(g=>g.includes(i));TileFX.burst((group||[]).map(k=>$('#board').children[k]))}history.push(E.clone(s));s=t;hintStage=0;logs.push(isTea?pos(i)+(s.last?' · 三张收起':' · 放入茶盘'):s.last+' 连消 · 下落并左移');render();say(logs[logs.length-1]);finish()}
function undo(){TileFX.clear();if(!history.length)return;s=history.pop();logs.pop();done=false;hintStage=0;highlight=[];$('#overlay').hidden=true;render();say('已完整恢复上一步，继续比较不同的顺序。')}
const routeMaps=L.map(l=>{let m=new Map,t=E.start(l);for(let i of l.witness){m.set(JSON.stringify(t),i);t=E.step(t,i)}return m});
function hint(){if(done||failed())return;assisted=true;hintStage++;if(hintStage===1){render();say('思路：'+L[level].tip);return}let exact=routeMaps[level].get(JSON.stringify(s)),route=exact===undefined?E.solve(s,L[level],30000):{route:[exact]};if(!route.route?.length){render();say(route.limited?'搜索已达上限，尚不能保证下一步。可撤销回到上一处选择。':'当前状态找不到满足目标的路线。撤销一步，再比较顺序。');return}let i=route.route[0];highlight=isTea?[i]:E.groups(s).find(g=>g.includes(i));render();say('点击高亮的'+pos(i)+'。这是当前棋盘已验证通关路线的一步；提示不会代替你操作。')}
$('#board').onclick=e=>{let el=e.target.closest('[data-i]');if(el)play(+el.dataset.i)};$('#undo').onclick=undo;$('#hint').onclick=hint;$('#restart').onclick=()=>start();$('#retryBtn').onclick=()=>start();$('#reviewBtn').onclick=()=>{$('#overlay').hidden=true};$('#levels').onclick=e=>{let el=e.target.closest('[data-level]');if(el)start(+el.dataset.level)};
function mode(classic){TileFX.clear();try{$('#classicFrame').contentWindow.TileFX?.clear()}catch(e){}$('#campaign').hidden=classic;$('#classicPane').hidden=!classic;$('#classicMode').setAttribute('aria-pressed',classic);$('#campaignMode').setAttribute('aria-pressed',!classic);if(classic&&!$('#classicFrame').srcdoc){$('#classicFrame').srcdoc=CLASSIC_HTML;$('#classicFrame').onload=()=>{try{let frame=$('#classicFrame');new ResizeObserver(()=>frame.style.height=frame.contentDocument.documentElement.scrollHeight+'px').observe(frame.contentDocument.body)}catch(e){}}}}
$('#classicMode').onclick=()=>mode(true);$('#campaignMode').onclick=()=>mode(false);$('#resetProgress').onclick=()=>{if(confirm('清除此游戏的24关完成记录？经典模式记录不受影响。')){progress={};save();render();say('已清除此游戏的关卡记录。')}};start();window.ELIMINATION_QA={kind:KIND,levels:L,engine:E,state:()=>E.clone(s),start,play,undo,hint,progress:()=>JSON.parse(JSON.stringify(progress))};
</script></body></html>
