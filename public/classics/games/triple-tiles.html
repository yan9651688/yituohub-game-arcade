function failed(){return isTea?s.tray.length>=7:!E.won(s,L[level])&&(!s.moves||!E.groups(s).length)}
function start(i=level){TileFX.clear();level=i;s=E.start(L[level]);history=[];assisted=false;hintStage=0;highlight=[];logs=[];done=false;$('#overlay').hidden=true;$('#levelPicker').open=false;save();render();say(L[level].tip)}
function finish(){if(E.won(s,L[level])){done=true;let p=progress[key(L[level])]||{};p.clear=true;p.best=Math.min(p.best??999,s.turns);if(!assisted)p.independent=true;else p.assisted=true;progress[key(L[level])]=p;save();$('#resultTitle').textContent=isTea?'茶山清空，茶香还在':'整盘果冻，收入瓶中';$('#resultText').textContent=L[level].title+' · '+(assisted?'辅助完成':'独立完成')+'。'+(level===23?'24 关随时可自由复玩。':'下一关，换一种观察方法。');$('#continueBtn').textContent=level===23?'回看棋盘':'下一关';$('#continueBtn').onclick=()=>level===23?($('#overlay').hidden=true):start(level+1);$('#overlay').hidden=false;render()}else if(failed()){$('#resultTitle').textContent=isTea?'茶盘满了，再想一步':'再安排一次合流';$('#resultText').textContent=isTea?'凑第三张之前，先为揭盖留位置。可无限撤销，也可原样重试。':'还没满足清空与连消目标。可无限撤销，比较不同顺序。';$('#continueBtn').textContent='撤销上一步';$('#continueBtn').onclick=undo;$('#overlay').hidden=false;render()}}
function play(i){if(done||failed())return;let t=E.step(s,i);highlight=[];if(!t){render();say(isTea?'先收上面挡住它的茶点；明牌清单可查看全部图案。':'这一颗暂时落单；点击至少两颗相邻同色中的任意一颗。');return}if(isTea){if(t.last){const value=s.tiles.find(x=>x.id===i).v;TileFX.burst([$('#board').querySelector('[data-i="'+i+'"]'),...s.tray.map((x,k)=>x.v===value?$('#tray').children[k]:null)])}}else{const group=E.groups(s).find(g=>g.includes(i));TileFX.burst((group||[]).map(k=>$('#board').children[k]))}history.push(E.clone(s));s=t;hintStage=0;logs.push(isTea?pos(i)+(s.last?' · 三张收起':' · 放入茶盘'):s.last+' 连消 · 下落并左移');render();say(logs[logs.length-1]);finish()}
function undo(){TileFX.clear();if(!history.length)return;s=history.pop();logs.pop();done=false;hintStage=0;highlight=[];$('#overlay').hidden=true;render();say('已完整恢复上一步，继续比较不同的顺序。')}
const routeMaps=L.map(l=>{let m=new Map,t=E.start(l);for(let i of l.witness){m.set(JSON.stringify(t),i);t=E.step(t,i)}return m});
function hint(){if(done||failed())return;assisted=true;hintStage++;if(hintStage===1){render();say('思路：'+L[level].tip);return}let exact=routeMaps[level].get(JSON.stringify(s)),route=exact===undefined?E.solve(s,30000):{route:[exact]};if(!route.route?.length){render();say(route.limited?'搜索已达上限，尚不能保证下一步。可撤销回到上一处选择。':'当前状态找不到满足目标的路线。撤销一步，再比较顺序。');return}let i=route.route[0];highlight=isTea?[i]:E.groups(s).find(g=>g.includes(i));render();say('点击高亮的'+pos(i)+'。这是当前棋盘已验证通关路线的一步；提示不会代替你操作。')}
$('#board').onclick=e=>{let el=e.target.closest('[data-i]');if(el)play(+el.dataset.i)};$('#undo').onclick=undo;$('#hint').onclick=hint;$('#restart').onclick=()=>start();$('#retryBtn').onclick=()=>start();$('#reviewBtn').onclick=()=>{$('#overlay').hidden=true};$('#levels').onclick=e=>{let el=e.target.closest('[data-level]');if(el)start(+el.dataset.level)};
function mode(classic){TileFX.clear();try{$('#classicFrame').contentWindow.TileFX?.clear()}catch(e){}$('#campaign').hidden=classic;$('#classicPane').hidden=!classic;$('#classicMode').setAttribute('aria-pressed',classic);$('#campaignMode').setAttribute('aria-pressed',!classic);if(classic&&!$('#classicFrame').srcdoc){$('#classicFrame').srcdoc=CLASSIC_HTML;$('#classicFrame').onload=()=>{try{let frame=$('#classicFrame');new ResizeObserver(()=>frame.style.height=frame.contentDocument.documentElement.scrollHeight+'px').observe(frame.contentDocument.body)}catch(e){}}}}
$('#classicMode').onclick=()=>mode(true);$('#campaignMode').onclick=()=>mode(false);$('#resetProgress').onclick=()=>{if(confirm('清除此游戏的24关完成记录？经典模式记录不受影响。')){progress={};save();render();say('已清除此游戏的关卡记录。')}};start();window.ELIMINATION_QA={kind:KIND,levels:L,engine:E,state:()=>E.clone(s),start,play,undo,hint,progress:()=>JSON.parse(JSON.stringify(progress))};
</script></body></html>
