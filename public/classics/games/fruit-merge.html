function fruit(f,ghost=false,alpha=1){let t=tiers[f.t],k=['cherry','strawberry','orange','apple','pineapple','melon','watermelon'][f.t];ctx.save();ctx.globalAlpha=ghost?.7:alpha;ctx.translate(f.x,f.y);ctx.shadowColor='#78503445';ctx.shadowBlur=4;ctx.shadowOffsetY=3;if(artReady(k)){ctx.drawImage(growthArt[k],-f.r,-f.r,f.r*2,f.r*2)}else{ctx.fillStyle=t.c;ctx.beginPath();ctx.arc(0,0,f.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font='10px sans-serif';ctx.textAlign='center';ctx.fillText(t.e,0,3)}ctx.restore()}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#fff9e9';ctx.fillRect(0,0,W,H);artRect(ctx,'scene',-10,-15,W+20,H+25);for(let y=145;y<510;y+=34){ctx.strokeStyle='#ead8af10';ctx.beginPath();ctx.moveTo(10,y);ctx.lineTo(350,y);ctx.stroke()}ctx.setLineDash([5,6]);ctx.strokeStyle=overflow>0?'#bd3f32':'#95734a';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(16,line);ctx.lineTo(344,line);ctx.stroke();ctx.setLineDash([]);ctx.font='10px sans-serif';ctx.textAlign='left';ctx.fillStyle='#805d35';ctx.fillText(overflow>0?'留意高度 · '+Math.max(0,2.5-overflow).toFixed(1)+'s':'果篮高度线',17,line-10);if(campaign){ctx.fillStyle='#805d35';ctx.font='10px sans-serif';ctx.textAlign='center';for(const x of [...new Set(FRUIT_LEVELS[missionIndex].initial.map(f=>f.x))]){ctx.beginPath();ctx.fillStyle='#d2ad6938';ctx.fillRect(x-28,70,56,22);ctx.fillStyle='#805d35';ctx.arc(x,85,4,0,Math.PI*2);ctx.fill();ctx.fillText('引导口',x,103)}}if(!over&&(!campaign||missionPos<FRUIT_LEVELS[missionIndex].queue.length)){let r=tiers[current].r,x=aimX(r);ctx.strokeStyle='#af7747';ctx.setLineDash([3,6]);ctx.beginPath();ctx.moveTo(x,75);ctx.lineTo(x,floor);ctx.stroke();ctx.setLineDash([]);fruit({x,y:55,r,t:current},true)}for(let f of fruits)fruit(f);for(let e of effects){const p=1-e.life/e.maxLife;ctx.save();ctx.globalAlpha=1-p;ctx.strokeStyle=e.c;ctx.lineWidth=3;ctx.beginPath();ctx.arc(e.x,e.y,e.r+p*22,0,Math.PI*2);ctx.stroke();for(let k=0;k<8;k++){const a=k*Math.PI/4,rr=e.r*.6+p*38;ctx.fillStyle=k%2?e.c:'#fff7bb';ctx.beginPath();ctx.ellipse(e.x+Math.cos(a)*rr,e.y+Math.sin(a)*rr+p*p*20,3*(1-p)+1,2*(1-p)+1,a,0,Math.PI*2);ctx.fill()}ctx.restore();if(p<.5)for(const f of e.old){const q=p*2;ctx.save();ctx.globalAlpha=1-q;fruit({...f,x:f.x+(e.x-f.x)*q,y:f.y+(e.y-f.y)*q,r:f.r*(1-q*.6)},false,1-q);ctx.restore()}}ctx.globalAlpha=1;ctx.fillStyle='#b88c54';ctx.fillRect(8,floor+1,344,11);if(campaign&&wall()>9){ctx.fillStyle='#b88c5455';ctx.fillRect(8,120,wall()-8,H-120);ctx.fillRect(W-wall(),120,wall()-8,H-120)}}
function frame(ts){if(!last)last=ts;const fxdt=Math.max(0,Math.min((ts-last)/1000,.1));for(const fx of effects)fx.life-=fxdt;effects=reducedFX()?[]:effects.filter(fx=>fx.life>0);acc+=Math.min((ts-last)/1000,.05);last=ts;while(acc>=1/120){step(1/120);acc-=1/120}draw();requestAnimationFrame(frame)}function aimAt(e){let r=canvas.getBoundingClientRect();aim=(e.clientX-r.left)*W/r.width}let fruitPointer=null;function cancelFruitPointer(e){if(e?.pointerId!==undefined&&e.pointerId!==fruitPointer)return;const id=fruitPointer;fruitPointer=null;if(id!==null&&canvas.hasPointerCapture?.(id))canvas.releasePointerCapture(id)}canvas.onpointerdown=e=>{if(e.isPrimary===false||(e.button!==undefined&&e.button!==0)||fruitPointer!==null)return;e.preventDefault();fruitPointer=e.pointerId;aimAt(e);canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(fruitPointer===null||fruitPointer===e.pointerId)aimAt(e)};canvas.onpointerup=e=>{if(fruitPointer!==e.pointerId)return;e.preventDefault();aimAt(e);cancelFruitPointer();drop()};canvas.onpointercancel=canvas.onlostpointercapture=cancelFruitPointer;canvas.ondragstart=canvas.onselectstart=e=>e.preventDefault();window.addEventListener?.('blur',cancelFruitPointer);window.addEventListener?.('pagehide',cancelFruitPointer);document.addEventListener('visibilitychange',()=>{if(document.hidden)cancelFruitPointer()});$('#drop').onclick=drop;document.onkeydown=e=>{if(/INPUT|SELECT|TEXTAREA|BUTTON/.test(e.target?.tagName||''))return;if(['ArrowLeft','ArrowRight',' '].includes(e.key)){e.preventDefault();if(e.key===' ')drop();else aim=Math.max(20,Math.min(340,aim+(e.key==='ArrowLeft'?-14:14)))}};$('#continue').onclick=()=>{if(campaign){if(missionIndex<23){missionIndex++;reset()}else{$('#over').hidden=true}}else{$('#over').hidden=true;overflow=0}};$('#restart').onclick=$('#again').onclick=reset;function aimX(r){let x=aim;if(campaign){const mouths=[...new Set(FRUIT_LEVELS[missionIndex].initial.map(f=>f.x))];const nearest=mouths.sort((a,b)=>Math.abs(a function wall(){return campaign?FRUIT_LEVELS[missionIndex].wall:9}
function missionSetup(){const s=$('#level');s.innerHTML='';FRUIT_LEVELS.forEach((l,i)=>{const o=document.createElement('option');o.value=i;o.textContent=l.id+' · '+l.title+(missionRecords[l.id]?' ✓':'');s.append(o)});$('#mode').onchange=e=>{campaign=e.target.value==='campaign';reset()};s.onchange=e=>{missionIndex=Number(e.target.value);reset()};$('#undo').onclick=undoDrop;$('#guide').onclick=()=>{if(!campaign)return;const l=FRUIT_LEVELS[missionIndex];$('#status').textContent=dropHistory.length?'路线建议只对应开局：可重试，再按供给顺序选择左右区域；现在的落点需要结合现有果堆判断。':'开局参考：'+l.witness.map(x=>x<145?'左区':x>215?'右区':'中区').join(' → ')+'。每次先看合并后的层级再落下一颗。这不是当前局面的自动解。';}}
