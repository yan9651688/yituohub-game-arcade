header><div><div class=\"eyebrow\">01 / AMBER ATELIER</div><h1>2048</h1><p class=\"lede\">把相同的数字，叠成一束温暖的光。</p></div><div class=\"metrics\"><div class=\"metric\"><small>得分</small><strong id=\"score\">0</strong></div><div class=\"metric\"><small>最佳</small><strong id=\"best\">0</strong></div></div></header><div class=\"layout\"><section class=\"arena\"><div id=\"board\" class=\"board\" aria-label=\"2048 棋盘\"></div><div id=\"over\" class=\"overlay\" hidden><h2 id=\"result\"></h2><p id=\"resultText\"></p><button class=\"primary\" id=\"again\">重新开始</button><button id=\"continue\" hidden>继续挑战</button></div></section><aside class=\"side\"><h2>数字的慢工坊</h2><div class=\"tags\"><span class=\"tag\">合并</span><span class=\"tag\">策略</span></div><p>滑动屏幕、按方向键，或点击下方箭头。相同数字相遇时合并，每次移动只合并一次。</p><p>目标是 2048。棋盘填满且无法移动时结束。</p><div class=\"arrows\"><button data-dir=\"up\" aria-label=\"向上\">↑</button><button data-dir=\"left\" aria-label=\"向左\">←</button><button data-dir=\"down\" aria-label=\"向下\">↓</button><button data-dir=\"right\" aria-label=\"向右\">→</button></div><div class=\"actions\"><button class=\"primary\" id=\"restart\">新的一局</button><button id=\"undo\">撤回一步</button></div><section id=\"runPanel\" hidden aria-live=\"polite\" aria-label=\"本局成长与结算\"></section><p class=\"status\" id=\"status\" role=\"status\" aria-live=\"polite\"></p><p class=\"note\">无需联网 · 无广告 · 记录保存在本机<br>小小一局，给脑袋放个假。</p></aside></div><footer>慢游街机 · JUST ONE MORE LITTLE GAME</footer></main><script>\nfunction safeRunBest(v){v=Number(v);return Number.isFinite(v)&&v>0?v:0;}\nfunction runPanelReset(before){runStats={before:safeRunBest(before),seen:[],notices:[],began:Date.now(),seconds:0,merges:0,moves:0,highest:0,finished:false};}\nfunction runAward(key,label){if(runStats.seen.includes(key))return;runStats.seen.push(key);runStats.notices.push(label);}\nfunction runTime(){return Math.max(0,Math.floor(runStats.finished?runStats.endedSeconds:(runStats.seconds||((Date.now()-runStats.began)/1000))));}\nfunction runPanel(score,progress,ended,details){const el=document.getElementById('runPanel');el.hidden=false;if(ended&&!runStats.finished)runStats.endedSeconds=runTime();runStats.finished=ended;runStats.peakScore=Math.max(runStats.peakScore||0,score);const delta=Math.max(0,runStats.peakScore-runStats.before);el.textContent=(ended?'本局结算 · ':'本局成长 · ')+progress+'\\n'+details+(ended?' · 用时 '+runTime()+' 秒 · 开局纪录 '+runStats.before+' · 本局提升 '+delta+' 分':'')+'\\n'+(runStats.notices.length?'已达成：'+runStats.notices.join(' / '):'尚未达成阶段徽章，继续积累')+(ended?'':'\\n阶段反馈不会暂停本局');}\nlet runStats;\nconst $=s=>document.querySelector(s);const readBest=(k,d=0)=>{try{return safeRunBest(localStorage.getItem(k))||d}catch{return d}};const saveBest=(k,v)=>{try{localStorage.setItem(k,v)}catch{}};\nlet grid,score,best=readBest('slow2048'),prev=null,won=false,ended=false;$('#best').textContent=best;\nfunction seed(){let a=grid.map((v,i)=>!v?i:-1).filter(i=>i>=0);if(a.length)grid[a[Math.floor(Math.random()*a.length)]]=Math.random()<.9?2:4}\nfunction mergeLine(a){a=a.filter(Boolean);let b=[],gain=0,merges=0;for(let i=0;i<a.length;i++){if(a[i]===a[i+1]){b.push(a[i]*2);gain+=a[i]*2;merges++;i++}else b.push(a[i])}return {line:b.concat(Array(4-b.length).fill(0)),gain,merges}}\nfunction canMove(){return grid.some(v=>v===0)||grid.some((v,i)=>(i%4<3&&v===grid[i+1])||(i<12&&v===grid[i+4]))}\nfunction classicFeedback(){runStats.highest=Math.max(...grid);for(const n of [32,64,128,256,512,1024,2048,4096])if(runStats.highest>=n)runAward('tile'+n,'点亮 '+n);if(score>0&&runStats.before===0)runAward('firstRecord','首份纪录');if(score>runStats.before&&runStats.before>0)runAward('record','刷新纪录');const next=[32,64,128,256,512,1024,2048,4096].find(n=>n>runStats.highest);runPanel(score,next?'下一阶段：'+runStats.highest+' → '+next:'点亮 4096，继续挑战',ended,'得分 '+score+' · 有效移动 '+runStats.moves+' 步 · 合并 '+runStats.merges+' 次 · 最大数字 '+runStats.highest);}\nfunction draw(){const b=$('#board');b.innerHTML='';grid.forEach(v=>{let e=document.createElement('div');e.className='tile'+(v>=128?' high':'');e.dataset.v=v;e.textContent=v||'';e.setAttribute('aria-label',v||'空格');b.append(e)});$('#score').textContent=score;if(score>best){best=score;saveBest('slow2048',best)}$('#best').textContent=best;$('#undo').disabled=!prev;classicFeedback()}\n\n/* v063 transient presentation; never part of game state */\nconst ClearFX=(()=>{const live=new Set();const reduced=()=>typeof matchMedia==='function'&&matchMedia('(prefers-reduced-motion: reduce)').matches;\nfunction clear(){for(const x of live){clearTimeout(x.timer);if(x.animation)x.animation.cancel();x.node.remove()}live.clear()}\nfunction capture(el){if(!el||!el.getBoundingClientRect||reduced())return null;const r=el.getBoundingClientRect();return {node:el.cloneNode(true),r}}\nfunction play(s,kind='merge',target=null){if(!s||reduced())return;while(live.size>=32){const x=live.values().next().value;clearTimeout(x.timer);if(x.animation)x.animation.cancel();x.node.remove();live.delete(x)}const n=s.node,r=s.r;n.removeAttribute('id');n.removeAttribute('onclick');n.setAttribute('aria-hidden','true');n.querySelectorAll('[id],[onclick]').forEach(e=>{e.removeAttribute('id');e.removeAttribute('onclick')});Object.assign(n.style,{position:'fixed',left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px',margin:'0',zIndex:'40',pointerEvents:'none',transition:'none',transformOrigin:'center',boxSizing:'border-box'});document.body.appendChild(n);const dx=target?target.left-r.left:0,dy=target?target.top-r.top:0;const end=kind==='bolt'?`translate(${dx}px,${dy-16}px) rotate(150deg) scale(.45)`:kind==='plank'?'translateY(24px) rotate(3deg) scale(.97)':`translate(${dx}px,${dy}px) scale(.25)`;const frames=[{opacity:.95,transform:'none',filter:'brightness(1)'},{opacity:.8,offset:.48,filter:'brightness(1.6)'},{opacity:0,transform:end,filter:'brightness(1.3)'}];const x={node:n};live.add(x);const done=()=>{clearTimeout(x.timer);n.remove();live.delete(x)};if(n.animate){x.animation=n.animate(frames,{duration:kind==='plank'?380:300,easing:'cubic-bezier(.2,.65,.35,1)',fill:'forwards'});x.animation.onfinish=done}else n.style.opacity='.5';x.timer=setTimeout(done,420)}\nfunction merges(old,dir,board){const cells=Array.from(board.children||[]),out=[];for(let j=0;j<4;j++){const ids=Array.from({length:4},(_,k)=>dir==='left'?j*4+k:dir==='right'?j*4+3-k:dir==='up'?k*4+j:(3-k)*4+j),filled=ids.filter(i=>old[i]);let dest=0;for(let k=0;k<filled.length;k++,dest++){const a=filled[k],b=filled[k+1];if(b!==undefined&&old[a]===old[b]){const r=cells[ids[dest]]?.getBoundingClientRect();out.push([capture(cells[a]),r],[capture(cells[b]),r]);k++}}}return out}\nif(typeof window!=='undefined'){window.addEventListener?.('pagehide',clear);window.addEventListener?.('resize',clear);window.addEventListener?.('scroll',clear,true)}const api={clear,capture,play,merges,count:()=>live.size};if(typeof window!=='undefined')window.ClearFX=api;return api;})();\n\nfunction move(dir){if(ended||!$('#over').hidden)return;const mergeFX=ClearFX.merges(grid,dir,$('#board'));const old=grid.slice(),oldScore=score,oldMerges=runStats.merges;for(let j=0;j<4;j++){let ids=Array.from({length:4},(_,k)=>dir==='left'?j*4+k:dir==='right'?j*4+3-k:dir==='up'?k*4+j:(3-k)*4+j);const m=mergeLine(ids.map(i=>grid[i]));ids.forEach((i,k)=>grid[i]=m.line[k]);score+=m.gain;runStats.merges+=m.merges}if(grid.some((v,i)=>v!==old[i])){prev={grid:old,score:oldScore,won,merges:oldMerges,moves:runStats.moves};runStats.moves++;seed();draw();mergeFX.forEach(([s,r])=>ClearFX.play(s,'merge',r));$('#status').textContent='每一步，都留一点空白。';if(!won&&grid.some(v=>v>=2048)){won=true;$('#status').textContent='点亮 2048！本局继续，挑战下一座灯塔。';classicFeedback()}if(!canMove()){ended=true;classicFeedback();show('本局完成',$('#runPanel').textContent,false)}}}\nfunction show(t,s,c){$('#result').textContent=t;$('#resultText').textContent=s;$('#continue').hidden=!c;$('#over').hidden=false}\nfunction restart(){cancelSwipe();ClearFX.clear();runPanelReset(best);grid=Array(16).fill(0);score=0;prev=null;won=false;ended=false;$('#over').hidden=true;seed();seed();draw();$('#status').textContent='从两个小数字开始。'}\n$('#restart').onclick=$('#again').onclick=restart;$('#continue').onclick=()=>$('#over').hidden=true;$('#undo').onclick=()=>{if(!prev)return;cancelSwipe();ClearFX.clear();grid=prev.grid;score=prev.score;won=prev.won;runStats.merges=prev.merges;runStats.moves=prev.moves;prev=null;ended=false;$('#over').hidden=true;draw();$('#status').textContent='已撤回，重新想想这一步。'};document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>move(b.dataset.dir));document.addEventListener('keydown',e=>{const d={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}[e.key];if(d){e.preventDefault();move(d)}});let swipePointer=null;function cancelSwipe(e){if(e?.pointerId!==undefined&&swipePointer&&e.pointerId!==swipePointer.id)return;const p=swipePointer;swipePointer=null;if(p&&$('#board').hasPointerCapture?.(p.id))$('#board').releasePointerCapture(p.id)}\n$('#board').onpointerdown=e=>{if(e.isPrimary===false||(e.button!==undefined&&e.button!==0)||swipePointer)return;e.preventDefault();swipePointer={id:e.pointerId,x:e.clientX,y:e.clientY};$('#board').setPointerCapture(e.pointerId)};$('#board').onpointerup=e=>{if(!swipePointer||swipePointer.id!==e.pointerId)return;e.preventDefault();const dx=e.clientX-swipePointer.x,dy=e.clientY-swipePointer.y;cancelSwipe();if(Math.max(Math.abs(dx),Math.abs(dy))>20)move(Math.abs(dx)>Math.abs(dy)?dx>0?'right':'left':dy>0?'down':'up')};$('#board').onpointercancel=$('#board').onlostpointercapture=cancelSwipe;$('#board').ondragstart=$('#board').onselectstart=e=>e.preventDefault();window.addEventListener?.('blur',cancelSwipe);window.addEventListener?.('pagehide',cancelSwipe);document.addEventListener('visibilitychange',()=>{if(document.hidden)cancelSwipe()});window.addEventListener?.('pagehide',cancelSwipe);document.addEventListener('visibilitychange',()=>{if(document.hidden)cancelSwipe()});window.Classic2048={move,restart,state:()=>({grid:grid.slice(),score,best,won,ended,runStats:JSON.parse(JSON.stringify(runStats))})};restart();\n<\/script></body></html>";
