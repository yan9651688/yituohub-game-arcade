<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { LineSegments2 } from 'three/addons/lines/LineSegments2.js';
import { LineSegmentsGeometry } from 'three/addons/lines/LineSegmentsGeometry.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ================= 渲染基础 =================
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000000, .02);
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, .05, 400);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), .04).texture;

const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 1);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 2);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -.0004;
sun.shadow.normalBias = .02;
scene.add(sun, sun.target);

// 天空球（跟随相机）
const skyU = { top: { value: new THREE.Color() }, mid: { value: new THREE.Color() }, bot: { value: new THREE.Color() } };
const sky = new THREE.Mesh(new THREE.SphereGeometry(150, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false, uniforms: skyU,
  vertexShader: `varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }`,
  fragmentShader: `uniform vec3 top, mid, bot; varying vec3 vP; void main(){
    float h = vP.y; vec3 c = mix(bot, mid, smoothstep(-.05,.18,h)); c = mix(c, top, smoothstep(.18,.7,h));
    gl_FragColor = vec4(c,1.); }`
}));
sky.renderOrder = -1;
scene.add(sky);
const stars = (() => {
  const n = 1500, p = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const r = 120, th = Math.random() * 6.283, ph = Math.random() * 1.35;
    p[i*3] = r * Math.sin(ph) * Math.cos(th); p[i*3+1] = r * Math.cos(ph); p[i*3+2] = r * Math.sin(ph) * Math.sin(th);
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(p, 3));
  const s = new THREE.Points(g, new THREE.PointsMaterial({ color: 0xffffff, size: .6, fog: false, transparent: true, opacity: .9 }));
  sky.add(s); return s;
})();

// ================= 工具函数 =================
function canvasTex(w, h, pixel = false) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  if (pixel) { tex.magFilter = THREE.NearestFilter; tex.minFilter = THREE.NearestFilter; }
  else tex.anisotropy = 4;
  return { cv, ctx, tex };
}
const std = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: .5, metalness: .05, ...o });
const rbox = (w, h, d, r, m) => new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 4, Math.min(r, w / 2 - .001, h / 2 - .001, d / 2 - .001)), m);
const cyl = (rt, rb, h, m, seg = 32) => new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), m);
const box = (w, h, d, m) => new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
const sph = (r, m, ws = 24, hs = 16) => new THREE.Mesh(new THREE.SphereGeometry(r, ws, hs), m);
const screenPlane = (w, h, tex) => new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: tex, toneMapped: false }));
function textPlane(text, w, h, { font = 'bold 64px Arial', color = '#fff', bg = null, cw = 512, ch = 128 } = {}) {
  const { ctx, tex } = canvasTex(cw, ch);
  if (bg) { ctx.fillStyle = bg; ctx.fillRect(0, 0, cw, ch); }
  ctx.fillStyle = color; ctx.font = font; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, cw / 2, ch / 2);
  return new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: tex, transparent: !bg, alphaTest: bg ? 0 : .08 }));
}
// 竖排文字（春联）
function vText(text, w, h, { color = '#1a1a1a', bg = '#c8161d', font = '"KaiTi","楷体","STKaiti",serif' } = {}) {
  const cw = 128, ch = Math.round(128 * h / w);
  const { ctx, tex } = canvasTex(cw, ch);
  ctx.fillStyle = bg; ctx.fillRect(0, 0, cw, ch);
  ctx.fillStyle = color; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const step = ch / text.length;
  ctx.font = `bold ${Math.min(96, step * .82)}px ${font}`;
  [...text].forEach((c, i) => ctx.fillText(c, cw / 2, step * (i + .5)));
  return new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshStandardMaterial({ map: tex, roughness: .8 }));
}
const chrome = new THREE.MeshPhysicalMaterial({ color: 0xffffff, metalness: 1, roughness: .08, iridescence: 1, iridescenceIOR: 1.7 });
const _up = new THREE.Vector3(0, 1, 0);
function bar(a, b, r, m, seg = 8) {
  const A = new THREE.Vector3(...a), B = new THREE.Vector3(...b);
  const mesh = cyl(r, r, A.distanceTo(B), m, seg);
  mesh.position.copy(A).add(B).multiplyScalar(.5);
  mesh.quaternion.setFromUnitVectors(_up, B.sub(A).normalize());
  return mesh;
}
function repeatTex(cv, rx, ry) {
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry); t.anisotropy = 4; return t;
}
// 龙年（2000 庚辰）窗花：团龙戏珠剪纸。红纸为实，刻掉的地方透明，返回一张画布
function dragonPaperCut(size = 512, flip = false) {
  const cv = document.createElement('canvas'); cv.width = cv.height = size;
  const c = cv.getContext('2d'), RED = '#d11f26';
  c.translate(size / 2, size / 2); c.scale(size / 220 * (flip ? -1 : 1), size / 220); // 设计坐标：半径 100 的圆
  c.lineJoin = 'round';
  const red = () => { c.globalCompositeOperation = 'source-over'; c.fillStyle = c.strokeStyle = RED; };
  const cut = () => { c.globalCompositeOperation = 'destination-out'; c.fillStyle = c.strokeStyle = '#000'; };
  const P = (a, r, x = 0, y = 0) => [x + Math.cos(a) * r, y + Math.sin(a) * r];
  const line = (pts, lw, cap = 'round') => { c.lineWidth = lw; c.lineCap = cap; c.beginPath(); pts.forEach(([x, y], i) => i ? c.lineTo(x, y) : c.moveTo(x, y)); c.stroke(); };
  // 火焰 / 鬃毛：底宽 w、长 len、尖端弯 curl 的一瓣
  const flame = (x, y, ang, len, w, curl = .3) => {
    c.save(); c.translate(x, y); c.rotate(ang); c.beginPath(); c.moveTo(0, -w / 2);
    c.quadraticCurveTo(len * .45, -w * .75 + curl * len * .1, len, curl * len);
    c.quadraticCurveTo(len * .55, w * .35 + curl * len * .55, 0, w / 2); c.closePath(); c.fill(); c.restore();
  };
  // Catmull-Rom 取样
  const spline = (pts, n) => {
    const out = [];
    for (let i = 0; i < n; i++) {
      const u = i / (n - 1) * (pts.length - 1), k = Math.min(Math.floor(u), pts.length - 2), t = u - k;
      const p0 = pts[Math.max(k - 1, 0)], p1 = pts[k], p2 = pts[k + 1], p3 = pts[Math.min(k + 2, pts.length - 1)];
      const f = (a, b, cc, d) => .5 * (2 * b + (-a + cc) * t + (2 * a - 5 * b + 4 * cc - d) * t * t + (-a + 3 * b - 3 * cc + d) * t * t * t);
      out.push([f(p0[0], p1[0], p2[0], p3[0]), f(p0[1], p1[1], p2[1], p3[1])]);
    }
    return out;
  };

  // ---- 外框：连珠圈 + 锯齿 ----
  red(); c.beginPath(); c.arc(0, 0, 100, 0, 6.2832); c.arc(0, 0, 91, 6.2832, 0, true); c.fill();
  for (let i = 0; i < 48; i++) { const a = i / 48 * 6.283, d = 3.1416 / 48; c.beginPath(); c.moveTo(...P(a - d, 91.5)); c.lineTo(...P(a, 86)); c.lineTo(...P(a + d, 91.5)); c.fill(); }
  cut(); for (let i = 0; i < 36; i++) { c.beginPath(); c.arc(...P(i / 36 * 6.283, 95.5), 2, 0, 7); c.fill(); }

  // ---- 祥云 ----
  const cloud = (x, y, s, rot) => {
    c.save(); c.translate(x, y); c.rotate(rot); c.scale(s, s);
    red(); for (const [cx, cy, r] of [[0, 0, 7], [-9, 3, 5.2], [9, 3, 5.2]]) { c.beginPath(); c.arc(cx, cy, r, 0, 7); c.fill(); }
    c.beginPath(); c.moveTo(-14, 4); c.lineTo(14, 4); c.quadraticCurveTo(22, 6, 26, 12); c.quadraticCurveTo(16, 9, 12, 9); c.lineTo(-12, 9); c.quadraticCurveTo(-15, 7, -14, 4); c.fill();
    cut(); c.lineWidth = 1.2; c.lineCap = 'round';
    for (const [cx, cy, r] of [[0, 0, 4.2], [-9, 3, 2.8], [9, 3, 2.8]]) { c.beginPath(); c.arc(cx, cy, r, 3.6, 3.6 + 4.6); c.stroke(); c.beginPath(); c.arc(cx + r * .25, cy, r * .45, 3.6, 3.6 + 3.8); c.stroke(); }
    c.restore();
  };
  cloud(26, -66, .75, 0); cloud(26, 18, .7, -.2);

  // ---- 火珠：在圆心，四只爪都朝它伸 ----
  const PX = 54, PY = -20;
  { const [px, py] = [PX, PY];
    red(); for (let i = 0; i < 9; i++) flame(...P(i / 9 * 6.283, 8, px, py), i / 9 * 6.283 + .5, 11, 6, .35);
    cut(); c.beginPath(); c.arc(px, py, 11.5, 0, 7); c.fill();
    red(); c.beginPath(); c.arc(px, py, 10, 0, 7); c.fill();
    cut(); c.lineWidth = 1.4; c.lineCap = 'round'; c.beginPath();
    for (let k = 0; k <= 60; k++) { const a = k / 60 * 11, r = 1 + k / 60 * 6.5; k ? c.lineTo(...P(a, r, px, py)) : c.moveTo(...P(a, r, px, py)); } c.stroke(); }

  // ---- 龙身脊线（从头到尾），宽度沿身体变化 ----
  const S = spline([[-22, -26], [-16, -8], [-24, 10], [-44, 20], [-52, 38], [-34, 54], [-6, 58], [22, 54], [44, 42], [58, 26], [66, 12]], 150);
  const N = S.length, wid = i => { const p = i / (N - 1); return p < .06 ? 13 + p / .06 * 6 : p < .6 ? 19 : 19 - 15 * Math.pow((p - .6) / .4, 1.1); };
  const T = S.map((_, i) => { const a = S[Math.max(i - 1, 0)], b = S[Math.min(i + 1, N - 1)], l = Math.hypot(b[0] - a[0], b[1] - a[1]); return [(b[0] - a[0]) / l, (b[1] - a[1]) / l]; });
  const Nm = T.map(([tx, ty]) => [-ty, tx]); // 指向背（外侧）
  const at = (i, o) => [S[i][0] + Nm[i][0] * o, S[i][1] + Nm[i][1] * o];
  const ang = i => Math.atan2(T[i][1], T[i][0]);

  // 腿：[脊线位置, 背侧(+1)/腹侧(-1), 大腿朝向, 小腿朝向, 大小]（朝向是画面上的角度）
  const legs = [[.33, -1, -.25, -.95, 1.05], [.24, 1, 3.5, 4.3, .95], [.56, -1, -.8, -2.0, 1.05], [.7, -1, -.6, -1.8, .95]];
  const legAt = legs.map(([p, side, a1, a2, s]) => {
    const i = Math.round(p * (N - 1)), root = at(i, side * wid(i) * .15);
    const knee = P(a1, 17 * s, ...root), foot = P(a2, 13 * s, ...knee);
    const tx = -(Math.cos(a1 + Math.PI) + Math.cos(a2)), ty = -(Math.sin(a1 + Math.PI) + Math.sin(a2));
    return { i, root, knee, foot, s, fa: a2, tuft: Math.atan2(ty, tx) };
  });
  const drawLeg = (L, pad) => {
    line([L.root, L.knee], 8 * L.s + pad); line([L.knee, L.foot], 5.5 * L.s + pad); c.beginPath(); c.arc(...L.knee, 4.6 * L.s + pad / 2, 0, 7); c.fill();
    if (pad) { c.beginPath(); c.arc(...P(L.fa, 4 * L.s, ...L.foot), 7 * L.s + pad / 2, 0, 7); c.fill(); }
    else {
      c.beginPath(); c.arc(...P(L.fa, 2, ...L.foot), 4 * L.s, 0, 7); c.fill();
      for (const d of [-.95, -.32, .32, .95]) flame(...P(L.fa + d, 3.2 * L.s, ...L.foot), L.fa + d * .8, 8.5 * L.s, 3.2, -.55 * Math.sign(d)); // 掌 + 四只往里勾的爪
      for (const [d, l] of [[-.35, 9], [.1, 7.5], [.5, 5.5]]) flame(...L.knee, L.tuft + d, l * L.s, 4, -.35);                       // 肘毛
    }
  };

  // 尾巴：一簇火焰尾
  { const i = N - 1, a = ang(i); red(); for (const [d, l, w] of [[-.9, 16, 6], [-.3, 20, 7], [.35, 16, 6], [.9, 11, 5]]) flame(...S[i], a + d, l, w, .3); }

  // 身体：从尾往头一段段画，每段先刻出轮廓线，交叠处就分得开

  const floor = new THREE.Mesh(new THREE.PlaneGeometry(300, 300), std(0x0b1a1c, { roughness: .35, metalness: .6 }));
  floor.rotation.x = -Math.PI / 2; floor.position.y = -2; g.add(floor);
  const grid = new THREE.GridHelper(300, 150, 0x8bcbb6, 0x315f56); grid.position.y = -1.99; grid.material.transparent = true; grid.material.opacity = .4; g.add(grid);
  const floaters = [];
  const bubbleM = new THREE.MeshPhysicalMaterial({ color: 0xffffff, transparent: true, opacity: .35, roughness: 0, metalness: .2, iridescence: 1, iridescenceIOR: 1.3 });
  const geos = [new THREE.IcosahedronGeometry(.5, 0), new THREE.TorusGeometry(.45, .15, 12, 32), new THREE.OctahedronGeometry(.5), new THREE.SphereGeometry(.45, 24, 16)];
  for (let k = 0; k < 50; k++) {
    const isB = k % 3 === 0, m = new THREE.Mesh(isB ? geos[3] : geos[k % 3], isB ? bubbleM : chrome);
    m.position.set(-8 + Math.random() * 62, 2.5 + Math.random() * 7, -6 - Math.random() * 12); m.scale.setScalar(.4 + Math.random());
    m.userData = { y: m.position.y, sp: .3 + Math.random() * .7, ph: Math.random() * 6.28 }; m.userData.noShadow = true; g.add(m); floaters.push(m);
  }
  return (t, dt, B) => {
    legacy.forEach(s => s.update && s.update(t, dt));
    grid.position.z = (t * 1.5) % 2;
    const p = pulse(B, 4);
    floaters.forEach(m => { const u = m.userData; m.position.y = u.y + Math.sin(t * u.sp + u.ph) * .6; m.rotation.x += dt * u.sp * .5; m.rotation.y += dt * u.sp * .7 + p * .05; });
  };
});
function addStation(title, text, build) {
  const i = legacy.length, g = new THREE.Group();
  g.position.set(i * 9, 0, 0); SCN.gadget.g.add(g);
  const ped = cyl(2.6, 2.9, .5, std(0x122628, { metalness: .8, roughness: .3 }), 64); ped.position.y = -1.75; g.add(ped);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(2.75, .04, 8, 96), new THREE.MeshBasicMaterial({ color: 0x8bcbb6, toneMapped: false })); ring.rotation.x = Math.PI / 2; ring.position.y = -1.5; g.add(ring);
  const light = new THREE.PointLight(0xbfe8da, 22, 14, 2); light.position.set(0, 4, 3); g.add(light);
  const st = { i, group: g, title, text, active: true, t0: 0 };
  st.update = build(g, st) || null;
  g.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  legacy.push(st);
}

addStation('诺基亚 3310 · 贪吃蛇', '摔不坏的“砖头”，一块电池能撑一个星期。短信 70 个字要掰着手指算，贪吃蛇的最高分，是课间最骄傲的战绩。', (g) => {
  const phone = new THREE.Group(); phone.position.y = .4; g.add(phone);
  phone.add(rbox(1.25, 2.8, .45, .3, std(0x223a7a, { roughness: .35, metalness: .25 })));
  const face = rbox(1.1, 1.3, .05, .1, std(0xc9ccd6, { metalness: .5, roughness: .3 })); face.position.set(0, .64, .23); phone.add(face);
  const { ctx, tex } = canvasTex(336, 192, true);
  const lcd = screenPlane(.84, .48, tex); lcd.position.set(0, .66, .26); phone.add(lcd);
  const logo = textPlane('NOKIA', .6, .15, { font: 'bold 80px Arial', color: '#1d2a55' }); logo.position.set(0, 1.12, .26); phone.add(logo);
  const nav = rbox(.72, .2, .07, .09, std(0x8fa3c4, { metalness: .4, roughness: .3 })); nav.position.set(0, -.12, .24); phone.add(nav);
  const pad = new THREE.InstancedMesh(new RoundedBoxGeometry(.26, .14, .06, 2, .05), std(0xb8c2d4, { metalness: .3 }), 12);
  const m4 = new THREE.Matrix4();
  for (let r = 0; r < 4; r++) for (let c = 0; c < 3; c++) { m4.makeTranslation(-.32 + c * .32, -.42 - r * .22, .24); pad.setMatrixAt(r * 3 + c, m4); }
  phone.add(pad);

  const W = 21, H = 10, CELL = 15, OX = 10, OY = 36;
  let snake, dir, food, score, best = 0, acc = 0;
  function placeFood() { do { food = { x: Math.floor(Math.random() * W), y: Math.floor(Math.random() * H) }; } while (snake.some(s => s.x === food.x && s.y === food.y)); }
  function reset() { snake = [{ x: 5, y: 5 }, { x: 4, y: 5 }, { x: 3, y: 5 }]; dir = { x: 1, y: 0 }; score = 0; placeFood(); }
  function step() {
    const h = snake[0];
    let bestD = null, bd = 1e9;
    for (const d of [{ x: 1, y: 0 }, { x: -1, y: 0 }, { x: 0, y: 1 }, { x: 0, y: -1 }]) {
      if (d.x === -dir.x && d.y === -dir.y) continue;
      const n = { x: h.x + d.x, y: h.y + d.y };
      if (n.x < 0 || n.y < 0 || n.x >= W || n.y >= H) continue;
      if (snake.slice(0, -1).some(s => s.x === n.x && s.y === n.y)) continue;
      const dist = Math.abs(n.x - food.x) + Math.abs(n.y - food.y) + Math.random() * .6;
      if (dist < bd) { bd = dist; bestD = d; }
    }
    if (!bestD) { reset(); return; }
    dir = bestD;
    const n = { x: h.x + dir.x, y: h.y + dir.y };
    snake.unshift(n);
    if (n.x === food.x && n.y === food.y) { score += 9; best = Math.max(best, score); placeFood(); if (snake.length > 45) reset(); }
    else snake.pop();
  }
  function draw() {
    ctx.fillStyle = '#b3c98a'; ctx.fillRect(0, 0, 336, 192);
    ctx.fillStyle = '#26331a';
    ctx.font = 'bold 20px monospace'; ctx.textAlign = 'left'; ctx.fillText(String(score).padStart(4, '0'), 10, 24);
    ctx.textAlign = 'right'; ctx.fillText('HI ' + String(best).padStart(4, '0'), 326, 24);
    ctx.fillRect(6, 30, 324, 2);
    ctx.strokeStyle = '#26331a'; ctx.lineWidth = 2; ctx.strokeRect(OX - 3, OY - 3, W * CELL + 6, H * CELL + 5);
    for (const s of snake) ctx.fillRect(OX + s.x * CELL + 1, OY + s.y * CELL + 1, CELL - 2, CELL - 2);
    const fx = OX + food.x * CELL + CELL / 2, fy = OY + food.y * CELL + CELL / 2;
    ctx.beginPath(); ctx.moveTo(fx, fy - 6); ctx.lineTo(fx + 6, fy); ctx.lineTo(fx, fy + 6); ctx.lineTo(fx - 6, fy); ctx.fill();
    tex.needsUpdate = true;
  }
  reset(); draw();
  return (t, dt) => {
    acc += dt; if (acc > .11) { acc = 0; step(); draw(); }
    phone.rotation.y = Math.sin(t * .5) * .35;
    phone.rotation.x = -.1 + Math.sin(t * .8) * .04;
    phone.position.y = .4 + Math.sin(t * 1.2) * .08;
  };
});

// ---- 压水井：字从出水口落下，被接成一栏 ----

// ---- 妈妈喊回家：声波从门口一圈圈荡开 ----

// ---- 炊烟：字从烟囱口冒出，一个个往上飘 ----

// ---- 窗户纸：格子里的剪影字，像贴近窗纸的影子慢慢清晰 ----

// ---- 挂钟：字排成弧形刻度，指针指着正在唱的词 ----

// ---- 墙上量身高：每个词一道铅笔线，一年比一年高 ----

// ---- 预副歌：窗光里的字；最后一句松开，一个个字母飘走 ----
LANG.pre = (L, ts) => {

// ================= 图形语言 B：副歌（四驱车 · 小吃 · 弹珠 · 陀螺 · 积木） =================
// 四驱车在赛道上的位置（由时间线写入 RACE.t0）
const RACE = { t0: 68.4, x0: -15.5, v0: 2.2, a: .55 };
const raceX = (ts, R = RACE) => { const d = Math.max(0, ts - R.t0); return R.x0 + R.v0 * d + R.a * d * d; };

// ---- TURN / IT / UP：赛车贴纸式的大字块，占左侧 60%，把车留在右边 ----
LANG.decal = (L, ts) => {
  const c = fc, u = U();
  const groups = [[0, 1, 2], [3, 4, 5]], SZ = [6.5, 4.8, 9.5], WD = [.6, 0, 1];
  const top0 = FH * .08, bottom = top0 + SZ[2] * u * .92;   // 三块贴纸底边对齐，整条只占画面顶部一窄条
  groups.forEach((ids, gi) => {
    const t0 = L.words[ids[0]].t, next = groups[gi + 1] ? L.words[groups[gi + 1][0]].t : 1e9;
    if (ts < t0 - .05) return;
    const out = eio((ts - next + .06) / .3);  // 下一组进来时，上一组整条往上推出画面
    if (out >= 1) return;
    const oy = -out * (bottom + 2 * u);
    let x = 5 * u;
    ids.forEach((i, j) => {
      const w = L.words[i], k = (ts - w.t) / .22, size = SZ[j] * u;
      fnt(c, size, 900, WD[j]);
      const ww = c.measureText(w.s).width, padX = size * .12, h = size * .92, bx = x;
      x += ww + padX * 2 + 1.2 * u;
      if (k < 0) return;
      const e = eox(k);
      // TURN：斜着甩进；IT：挤紧；UP：往上顶
      let tx = bx + padX, yy = bottom + oy - size * .16, skew = 0, rot = 0;
      if (j === 0) { tx = lerp(-ww, tx, e); skew = lerp(-.5, -.18, e); rot = lerp(-.25, 0, e); }
      if (j === 1) tx += (1 - e) * 6 * u;
      if (j === 2) yy += (1 - eback(k)) * size * .6;
      const top = yy - size * .76; c.__nofit = k < 1 || out > 0;

      c.fillStyle = PAPER; c.fillRect(tx - padX, top, ww + padX * 2, h);
      c.fillStyle = LRED; c.fillRect(tx - padX, top + h - size * .1, (ww + padX * 2) * cl(k * 1.4), size * .1);
      txt(c, w.s, tx, yy - size * .04, { fill: INK });
      c.restore(); c.__nofit = false;
    });
  });
};

// ---- WE WERE RUNNING WILD：字排成横向的流线，和车一起加速冲出画面 ----
LANG.speed = (L, ts) => {
  const c = fc, u = U(), wild = L.words[L.words.length - 1].t;
  // 唱完 wild 停够 0.8 秒 → 慢起步冲出右边 → 切到赛车镜头后从左边追回来（放到画面上方的天空里，不挡路面上的字）
  // → 再停 1.3 秒 → 再冲出去
  const T1 = wild + .8, T2 = T1 + .5, T3 = L.b - .6, RUN = p => 125 * u * p * p;
  let go = 0, acc = 0;
  if (ts >= T3) { const p = cl((ts - T3) / .6); acc = RUN(p); go = p * 1.2; }
  else if (ts >= T2) { const e = eox((ts - T2) / .5); acc = -(1 - e) * 110 * u; go = (1 - e) * .6; }
  else if (ts >= T1) { const p = cl((ts - T1) / .5); acc = RUN(p); go = p * 1.2; }
  let size = 11 * u; const y = ts >= T2 ? FH * .22 : FH * .76;
  { let tw = 0; L.words.forEach(w => { const big = /running|wild/i.test(w.s); fnt(c, big ? size * 1.25 : size * .7, 900, big ? 1 : .3); tw += c.measureText(w.s).width * (/running/i.test(w.s) ? 1.45 : 1) + size * .25; });
    tw += size * .5; if (tw > FW - 10 * u) size *= (FW - 10 * u) / tw; }
  c.__nofit = acc !== 0;
  // 速度线
  c.fillStyle = PAPER;
  for (let i = 0; i < 14; i++) {
    const s = hash(i * 7.3), len = (8 + s * 30) * u * (1 + go * 3), yy = y - size * (1.6 + hash(i) * 1.8) + i * 1.8 * u;
    const x = ((s * FW - ts * (60 + s * 80) * u * (1 + go * 4)) % (FW + len) + FW + len) % (FW + len) - len;
    c.globalAlpha = .25 + s * .35; c.fillRect(x, yy, len, 2 + s * 2);
  }
  c.globalAlpha = 1;
  let x = 5 * u + acc;
  L.words.forEach((w, i) => {
    const k = (ts - w.t) / .18;
    const running = /running/i.test(w.s), wl = /wild/i.test(w.s);
    const sx = running && k > 0 ? lerp(1, 1.45, eio((ts - w.t) / .35)) : wl && k > 0 ? 1 + go * 2.5 : 1;
    fnt(c, (wl || running) ? size * 1.25 : size * .7, 900, running || wl ? 1 : .3);
    if (k < 0) { x += ghost(c, w.s, x, y) + size * .25; return; }
    const ex = (1 - eox(k)) * -8 * u;
    c.save(); c.translate(x + ex, y); c.transform(1, 0, -.22, 1, 0, 0);
    const ww = txt(c, w.s, 0, 0, { fill: wl ? ACC : PAPER, sx });
    c.restore();
    x += ww + size * .25;
  });
  c.__nofit = false;
};

// ---- 赛道上的路面字：词被刷在车道上，车开过去 ----
// 赛道贴面：画布 x = 世界 x + 17，画布 y = 世界 z - 5 + 1.2；ctx.rotate(π/2) 让字的“上”朝 +x（车开的方向）
LANG.road = (L, ts) => {
  const S = SF.track, c = surfBegin(S), o = L.o, RR = o.race || RACE, laneY = (5.64 - 5 + 1.2) * 100;
  // 回忆线：车道边线跟着车一路画过去
  const cx = (raceX(ts, RR) + 17) * 100;
  c.fillStyle = JADE; c.globalAlpha = .9; c.fillRect(0, laneY + 58, Math.max(0, cx), 5); c.globalAlpha = 1;
  // 词成组地“跟着车跑”：在车前方排成一列（近的先唱），相对车只慢慢往后退，所以一直留在镜头里；
  // 下一组开唱时，这一组被车甩开、向后冲出画面，下一组再从前方冲进来

  const groups = o.groups || [ids], car = raceX(ts, RR), FS = 64, GAP = .35;

  fnt(c, FS, 900, .1);

  const slot = {}, fade = {}; let prevEnd = -1e9;   // 上一组还没走完时，新组排在它后面，不叠在一起
  groups.forEach((g, gi) => {

    const run = ts > tEnd ? (ts - tEnd) * (ts - tEnd) * 9 : 0, enter = (1 - eox((ts - t0) / .45)) * 6;
    let off = 0;

    pc.userData.ry = -.32; }

  // ---- 磁带 ----
  const tape = grp(3.5, 2.3, -1.4);
  { const b = new W().box(2.4, 1.5, .24).rrect(2.0, .42, .06, 0, .38, .13)
      .rrect(1.3, .44, .1, 0, -.08, .13)
      .poly([[-.8, -.75, .13], [-.62, -.46, .13], [.62, -.46, .13], [.8, -.75, .13]])
      .circ(.05, -.35, -.62, .13, 'z', 10).circ(.05, .35, -.62, .13, 'z', 10);
    tape.add(b.mesh(LM(VP, 2.4)));
    tape.add(new W().seg([-.85, .44, .14], [.3, .44, .14]).seg([-.85, .32, .14], [-.1, .32, .14]).mesh(LM(N.pale, 1.4, { op: .8 })));
    tape.userData.reels = [-.55, .55].map(x => {
      const r = new W().circ(.3, 0, 0, 0, 'z', 28).circ(.1, 0, 0, 0, 'z', 14);
      for (let i = 0; i < 6; i++) { const a = i / 6 * Math.PI * 2; r.seg([Math.cos(a) * .1, Math.sin(a) * .1, 0], [Math.cos(a) * .16, Math.sin(a) * .16, 0]); }
      const m = r.mesh(LM(N.cyan, 2)); m.position.set(x, -.08, .14); tape.add(m); return m; });
    tape.userData.ry = -.45; tape.rotation.z = .12; }

  // ---- 小霸王：主机 + 卡带 + 手柄 ----
  const nes = grp(3.6, -1.9, .9);
  { const b = new W().box(2.2, .45, 1.3).box(1.1, .02, .5, 0, .23, -.15)
      .seg([-.95, .05, .66], [-.45, .05, .66]).circ(.07, .7, .05, .66, 'z', 12).circ(.07, .95, .05, .66, 'z', 12);
    nes.add(b.mesh(LM(PV, 2.4)));
    const cart = new W().box(1.0, .7, .16, 0, .56, -.15).rrect(.75, .38, .05, 0, .6, -.06);
    nes.add(cart.mesh(LM(N.cyan, 2)));
    const pad = new W().rrect(1.3, .55, .22, 0, 0, 0)
      .seg([-.48, 0, 0], [-.22, 0, 0]).seg([-.35, -.13, 0], [-.35, .13, 0])
      .circ(.07, .3, -.05, 0, 'z', 12).circ(.07, .48, .05, 0, 'z', 12)
      .seg([-.08, -.05, 0], [0, -.05, 0]).seg([.06, -.05, 0], [.14, -.05, 0]);
    const pm = pad.mesh(LM(PC, 2.2)); pm.position.set(-1.9, -.45, 1.2); pm.rotation.set(-1.1, .25, 0); nes.add(pm);
    const cord = new W(), cp = []; for (let i = 0; i <= 16; i++) { const k = i / 16; cp.push([lerp(-1.25, -1.0, k) - Math.sin(k * Math.PI) * .5, -.35 + Math.sin(k * Math.PI) * .15 - k * .05, lerp(1.0, .65, k)]); }
    nes.add(cord.poly(cp).mesh(LM(N.vio, 1.2, { op: .6 })));
    nes.userData.ry = -.5; }

  // ---- 玩具：魔方、陀螺、积木、弹珠 ----
  const cube = grp(-1.6, 2.9, -2.2);
  { const s = .45, g = new W().box(.9, .9, .9), q = new W();
    for (const u of [-.15, .15]) for (const f of [-s, s]) {
      q.seg([f, u, -s], [f, u, s]).seg([f, -s, u], [f, s, u]);
      q.seg([u, f, -s], [u, f, s]).seg([-s, f, u], [s, f, u]);
      q.seg([u, -s, f], [u, s, f]).seg([-s, u, f], [s, u, f]); }
    cube.add(g.mesh(LM(N.pale, 2.2))); cube.add(q.mesh(LM(PC, 1.5))); }
  const top = grp(-1.4, -2.2, 1.6);
  { const prof = [[0, -.7], [.14, -.45], [.52, -.05], [.58, .05], [.44, .16], [.08, .22], [.08, .56]], w = new W();
    prof.forEach(([r, y]) => { if (r > .01) w.circ(r, 0, y, 0, 'y', 28); });
    for (let i = 0; i < 8; i++) { const a = i / 8 * Math.PI * 2; w.poly(prof.map(([r, y]) => [Math.cos(a) * r, y, Math.sin(a) * r])); }
    const m = w.mesh(LM(PV, 1.8)); top.add(m); top.userData.spin = m;
    top.add(new W().circ(.56, 0, 0, 0, 'y', 28).mesh(LM(N.cyan, 2.2))); top.userData.spin2 = top.children[1]; }
  const lego = grp(2.6, 3.7, -3);
  { const w = new W().box(1.3, .5, .65);
    for (let i = 0; i < 4; i++) for (let j = 0; j < 2; j++) { const x = -.48 + i * .32, z = -.16 + j * .32; w.circ(.1, x, .25, z, 'y', 16).circ(.1, x, .36, z, 'y', 16).seg([x - .1, .25, z], [x - .1, .36, z]).seg([x + .1, .25, z], [x + .1, .36, z]); }
    lego.add(w.mesh(LM(VP, 2))); lego.userData.ry = .5; }
  const marbles = [[1.9, -1.3, 2.6, N.cyan], [2.3, -1.35, 3.0, N.pink], [1.5, -1.36, 3.1, N.vio]].map(([x, y, z, c]) => {
    const g = grp(x, y, z); g.add(new W().circ(.14, 0, 0, 0, 'z', 20).circ(.14, 0, 0, 0, 'y', 20).circ(.14, 0, 0, 0, 'x', 20).mesh(LM(c, 1.6))); return g; });

  // ---- 四驱车：在地面网格上绕圈跑 ----
  const FLOOR = -3.4, car = new THREE.Group(); NS.add(car);
  { const b = new W().box(1.5, .22, .58, 0, .2, 0).poly([[-.35, .31, -.2], [-.15, .48, -.15], [.35, .48, -.15], [.5, .31, -.2]]).poly([[-.35, .31, .2], [-.15, .48, .15], [.35, .48, .15], [.5, .31, .2]])
      .seg([-.15, .48, -.15], [-.15, .48, .15]).seg([.35, .48, -.15], [.35, .48, .15]).box(.12, .3, .1, -.68, .4, 0).box(.3, .03, .8, -.72, .56, 0);
    car.add(b.mesh(LM(PV, 2.2)));
    car.userData.wh = [[-.5, -.36], [.5, -.36], [-.5, .36], [.5, .36]].map(([x, z]) => {
      const w = new W().circ(.16, 0, 0, 0, 'z', 16); for (let i = 0; i < 3; i++) { const a = i / 3 * Math.PI; w.seg([Math.cos(a) * .16, Math.sin(a) * .16, 0], [-Math.cos(a) * .16, -Math.sin(a) * .16, 0]); }
      const m = w.mesh(LM(N.cyan, 1.8)); m.position.set(x, .16, z); car.add(m); return m; }); }

  // ---- 山峦：线框地形往镜头方向流动，中间是平的山谷（车在里面跑），两侧和远处起伏成山 ----
  const TU = { uT: { value: 0 }, uBg: { value: new THREE.Color(BG) } };
  const TV = `
    uniform float uT; varying float vH; varying float vD;
    float hs(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float vn(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f);
      return mix(mix(hs(i), hs(i + vec2(1, 0)), f.x), mix(hs(i + vec2(0, 1)), hs(i + vec2(1, 1)), f.x), f.y); }
    float fbm(vec2 p){ float a = .5, s = 0.; for (int i = 0; i < 4; i++) { s += a * vn(p); p *= 2.03; a *= .5; } return s; }
    void main(){
      vec3 p = position; float sc = uT * 1.4, fr = mod(sc, 1.);
      p.z += fr;                                          // 网格只平移不到一格，采样坐标按整格走 → 山在往前流
      vec2 sp = vec2(p.x, position.z - (sc - fr));
      float ax = abs(p.x - 1.), side = smoothstep(9., 24., ax), back = smoothstep(-34., -58., p.z);
      float env = max(side * (.4 + ax * .02), back * .8);
      float wave = .85 + .15 * sin(uT * .7 + p.x * .18 + sp.y * .12);   // 山脊缓缓“呼吸”
      float h = env * fbm(sp * .15) * 4.2 * wave + back * 1.2 * smoothstep(.2, .8, vn(vec2(p.x * .08, 3.)));
      p.y = -3.4 + h; vH = h;
      vec4 mv = modelViewMatrix * vec4(p, 1.); vD = -mv.z; gl_Position = projectionMatrix * mv;
    }`;
  const tLines = new THREE.ShaderMaterial({ uniforms: TU, vertexShader: TV, transparent: true, depthWrite: false, fragmentShader: `
    varying float vH; varying float vD;
    void main(){
      vec3 lo = vec3(.42, .16, .95), mid = vec3(1., .31, .85), hi = vec3(1., .55, .9);
      vec3 c = mix(lo, mid, smoothstep(.2, 2.2, vH)); c = mix(c, hi, smoothstep(3., 5.5, vH));
      float a = mix(.24, .55, smoothstep(0., 2., vH)) * (1. - smoothstep(30., 88., vD) * .6);
      gl_FragColor = vec4(c, a);
    }` });
  const tFill = new THREE.ShaderMaterial({ uniforms: TU, vertexShader: TV, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1,
    fragmentShader: `uniform vec3 uBg; void main(){ gl_FragColor = vec4(uBg, 1.); }` });
  { const p = [], X0 = -44, X1 = 46, Z0 = -66, Z1 = 12;
    for (let x = X0; x <= X1; x++) for (let z = Z0; z < Z1; z++) p.push(x, 0, z, x, 0, z + 1);
    for (let z = Z0; z <= Z1; z++) for (let x = X0; x < X1; x++) p.push(x, 0, z, x + 1, 0, z);
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(p, 3));
    const L = new THREE.LineSegments(g, tLines); L.frustumCulled = false; L.renderOrder = 2; NS.add(L);
    const pg = new THREE.PlaneGeometry(X1 - X0, Z1 - Z0, X1 - X0, Z1 - Z0); pg.rotateX(-Math.PI / 2); pg.translate((X0 + X1) / 2, 0, (Z0 + Z1) / 2);
    const M = new THREE.Mesh(pg, tFill); M.frustumCulled = false; M.renderOrder = 1; NS.add(M); }

  // ---- 夕阳：中偏左的远处，半沉在山后；上浅粉→玫红→紫的渐变，下半截是往下流的横切缝 ----
  const sunU = { uT: { value: 0 } };
  const sun = new THREE.Mesh(new THREE.PlaneGeometry(2.6, 2.6), new THREE.ShaderMaterial({ uniforms: sunU, transparent: true, depthWrite: false,
    vertexShader: `varying vec2 vU; void main(){ vU = position.xy / 1.; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }`,
    fragmentShader: `
      uniform float uT; varying vec2 vU;
      void main(){
        float d = length(vU), y = vU.y;
        vec3 top = vec3(1., .82, .96), mid = vec3(1., .22, .66), bot = vec3(.5, .15, .95);
        vec3 c = y > 0. ? mix(mid, top, smoothstep(0., .95, y)) : mix(mid, bot, smoothstep(0., -.9, y));
        float body = 1. - smoothstep(.985, 1., d);
        float cut = 1.;
        if (y < .5) { float w = mix(.05, .6, clamp((.5 - y) / 1.2, 0., 1.)); float s = fract(y * 7. + uT * .25); cut = smoothstep(w - .02, w + .02, s); }
        float halo = exp(-max(d - 1., 0.) * 3.2) * .55 * step(1., d);
        vec3 col = c * body * cut * .62 + vec3(.8, .2, .65) * halo * .6;
        gl_FragColor = vec4(col, max(body * cut, halo));
      }` }));
  sun.scale.set(10.5, 10.5, 1); sun.position.set(-22, 8.5, -80); NS.add(sun);
  // 地平线上一层紫粉辉光
  const glow = new THREE.Mesh(new THREE.PlaneGeometry(260, 40), new THREE.ShaderMaterial({ transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    vertexShader: `varying vec2 vU; void main(){ vU = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }`,
    fragmentShader: `varying vec2 vU; void main(){ float k = exp(-pow((vU.y - .38) * 5., 2.)) * (1. - pow(abs(vU.x - .42) * 2., 2.) * .6); gl_FragColor = vec4(vec3(.55, .12, .6) * k, 1.); }` }));
  glow.position.set(-10, 0, -82); NS.add(glow);
  { const p = []; for (let i = 0; i < 320; i++) p.push((hash(i * 3.1) - .5) * 200, hash(i * 7.7) * 60 + 4, -84 - hash(i * 1.3) * 6);
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(p, 3));
    NS.add(new THREE.Points(g, new THREE.PointsMaterial({ color: N.pale, size: .25, fog: false, transparent: true, opacity: .7 }))); }

  // ---- 尺寸 / 鼠标视差 ----
  let VW = 1, VH = 1; const mouse = { x: 0, y: 0, sx: 0, sy: 0 };
  function nsize() {
    VW = innerWidth; VH = innerHeight; NR.setSize(VW, VH, false); comp.setSize(VW, VH);
    NC.aspect = VW / VH; NC.setViewOffset(VW, VH, VW > VH * 1.1 ? -VW * .25 : 0, 0, VW, VH); NC.updateProjectionMatrix();
    mats.forEach(m => m.resolution.set(VW, VH));
  }
  nsize(); addEventListener('resize', nsize);
  addEventListener('pointermove', e => { mouse.x = e.clientX / innerWidth * 2 - 1; mouse.y = e.clientY / innerHeight * 2 - 1; });

  // ---- 动画 ----
  const born = performance.now(); let hideAt = null, flick = [];
  const objs = [pc, tape, nes, cube, top, lego, ...marbles];
  function nloop() {
    requestAnimationFrame(nloop);
    const now = performance.now(), hid = host.classList.contains('hide');
    if (hid) { if (hideAt == null) hideAt = now; if (now - hideAt > 1000) return; } else hideAt = null;
    const t = (now - born) / 1000;
    // 开场逐段“描线”
    reveal.forEach((m, i) => { const k = cl((t - .15 - (i % 9) * .09) / 1.4); m.geometry.instanceCount = Math.max(0, Math.ceil(m.userData.n * eio(k))); });
    objs.forEach((g, i) => { const [x, y, z] = g.userData.base; g.position.y = y + Math.sin(t * .9 + i * 1.7) * .12; if (g.userData.ry != null) g.rotation.y = g.userData.ry + Math.sin(t * .35 + i) * .22; });
    pc.userData.cur.visible = (t % 1) < .55;
    tape.userData.reels.forEach(r => r.rotation.z -= .03);
    cube.rotation.set(t * .31, t * .43, .2);
    top.userData.spin.rotation.y = t * 9; top.rotation.z = Math.sin(t * 1.3) * .18; top.rotation.x = Math.cos(t * 1.3) * .18;
    marbles.forEach((g, i) => { g.rotation.set(t * (1 + i * .3), t * .7, 0); });
    const a = t * .45, cx = 1.4 + Math.cos(a) * 5.2, cz = -6 + Math.sin(a) * 3.2;
    car.position.set(cx, FLOOR, cz); car.rotation.y = -Math.atan2(Math.cos(a) * 3.2, -Math.sin(a) * 5.2);
    car.userData.wh.forEach(w => w.rotation.z -= .35);
    TU.uT.value = t; sunU.uT.value = t;
    // 霓虹接触不良似的偶尔闪一下
    if (Math.random() < .012) flick = [mats[Math.floor(Math.random() * mats.length)], now + 60 + Math.random() * 120];
    if (flick.length) { flick[0].visible = now > flick[1]; if (now > flick[1]) flick = []; }
    mouse.sx += (mouse.x - mouse.sx) * .05; mouse.sy += (mouse.y - mouse.sy) * .05;
    NC.position.set(mouse.sx * .8, .9 - mouse.sy * .5, 14.5); NC.lookAt(1, .1, 0);
    comp.render();
  }
  nloop();
}

</script>
